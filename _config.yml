source: .
destination: ./_site
include:
  - LICENSE.txt
  - favicon.ico
  - index.html
  - main-latest.zip
  # Covers both the raw distribution specs (opensearch-openapi-<dist>.yaml,
  # used for client generation) and the enriched doc-only copies
  # (opensearch-openapi-<dist>-tagged.yaml, used by index.html/Scalar) -- both
  # are staged at repo root by build.yml and now share the .yaml extension.
  - opensearch-openapi-*.yaml
  - opensearch-openapi.yaml
exclude:
  - '*'
keep_files:
  - opensearch-openapi-*.yaml
  - opensearch-openapi.yaml
