openapi: 3.1.0
info:
  title: OpenSearch API
  description: OpenSearch API
  version: 1.0.0
paths:
  /adopt:
    post:
      operationId: adopt.0
      requestBody:
        $ref: '#/components/requestBodies/adopt'
      responses:
        '200':
          $ref: '#/components/responses/adopt@200'
components:
  requestBodies:
    adopt:
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../schemas/animals.yaml#/components/schemas/Dog'
              - $ref: '../schemas/animals.yaml#/components/schemas/Cat'
  responses:
    adopt@200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '../schemas/animals.yaml#/components/schemas/Shelter'
