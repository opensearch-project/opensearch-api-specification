$schema: http://json-schema.org/draft-07/schema#

type: object
properties:
  tags:
    type: array
    items:
      $comment: https://spec.openapis.org/oas/v3.1.0#tag-object
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        externalDocs:
          type: object
          properties:
            description:
              type: string
            url:
              type: string
              format: uri
          required:
            - url
      required:
        - name
required:
  - tags
