$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test moving an index from the warm tier to the hot tier.
version: '>= 3.7'
prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: movies
    request:
      payload:
        settings:
          number_of_replicas: 0
  - path: /{index}/_tier/warm
    method: POST
    parameters:
      index: movies
  - path: /{index}/_settings
    method: GET
    parameters:
      index: movies
      flat_settings: true
    response:
      status: 200
      payload:
        movies:
          settings:
            index.tiering.state: WARM
    retry:
      count: 10
epilogues:
  - path: /{index}
    method: DELETE
    parameters:
      index: movies
    status: [200, 404]
chapters:
  - synopsis: Move an index to the hot tier.
    path: /{index}/_tier/hot
    method: POST
    parameters:
      index: movies
      timeout: 30s
      cluster_manager_timeout: 30s
    response:
      status: 200
      payload:
        acknowledged: true
