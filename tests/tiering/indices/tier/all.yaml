$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test listing the tiering operations in the cluster.
version: '>= 3.7'
chapters:
  - synopsis: List tiering operations.
    path: /_tier/all
    method: GET
    response:
      status: 200
      content_type: text/plain
  - synopsis: List tiering operations (format=json).
    path: /_tier/all
    method: GET
    parameters:
      format: json
    response:
      status: 200
      payload: []
  - synopsis: List tiering operations to the warm tier.
    path: /_tier/all
    method: GET
    parameters:
      format: json
      target: _warm
    response:
      status: 200
  - synopsis: List tiering operations with column headers, sorted by index.
    path: /_tier/all
    method: GET
    parameters:
      v: true
      h: [index, state]
      s: [index]
    response:
      status: 200
      content_type: text/plain
  - synopsis: Show help for listing tiering operations.
    path: /_tier/all
    method: GET
    parameters:
      help: true
    response:
      status: 200
      content_type: text/plain
