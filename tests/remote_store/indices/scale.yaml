$schema: ../../../json_schemas/test_story.schema.yaml

description: Test scaling a remote-store-backed index to search-only mode and back.
prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: games
epilogues:
  - path: /games
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Scale an index to search-only mode.
    version: '>= 3.0'
    path: /{index}/_scale
    method: POST
    parameters:
      index: games
    request:
      payload:
        search_only: true
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Restore an index from search-only mode.
    version: '>= 3.0'
    path: /{index}/_scale
    method: POST
    parameters:
      index: games
    request:
      payload:
        search_only: false
    response:
      status: 200
      payload:
        acknowledged: true
