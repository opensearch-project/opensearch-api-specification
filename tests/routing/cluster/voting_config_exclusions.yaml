$schema: ../../../json_schemas/test_story.schema.yaml

description: Test adding/removing cluster-manager-eligible nodes from the voting configuration exclusion list.
prologues:
  - path: /_cat/nodes
    id: node
    method: GET
    parameters:
      full_id: true
      size: 1
      format: json
      h: id,name
    output:
      id: payload[0].id
      name: payload[0].name
chapters:
  - synopsis: Adds a node to the voting configuration exclusion list.
    path: /_cluster/voting_config_exclusions
    method: POST
    parameters:
      node_ids: ${node.id}
    response:
      status: 200
  - synopsis: Deletes a voting configuration exclusion list.
    path: /_cluster/voting_config_exclusions
    method: DELETE
    parameters:
      wait_for_removal: false
    response:
      status: 200
  - synopsis: Adds a node to the voting configuration exclusion list by node name.
    path: /_cluster/voting_config_exclusions/{node_name}
    method: POST
    parameters:
      node_name: ${node.name}
    response:
      status: 200
  - synopsis: Deletes the voting configuration exclusion list again.
    path: /_cluster/voting_config_exclusions
    method: DELETE
    parameters:
      wait_for_removal: false
    response:
      status: 200
