$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test semantic field type schema validation without requiring ML models.
version: '>= 3.1'

prologues: []

epilogues:
  - path: /semantic_schema_test
    method: DELETE
    status: [200, 404]

chapters:
  # Test 1: Verify semantic field type is recognized by OpenSearch
  # Success criteria: NOT "unknown field type" error
  # Expected: Model not found error proves semantic type is recognized
  - synopsis: Create semantic field with minimal required properties.
    path: /{index}
    method: PUT
    parameters:
      index: semantic_schema_test
    request:
      payload:
        mappings:
          properties:
            content:
              type: semantic
              model_id: test_model_placeholder
    response:
      # 200 = success (unlikely without model)
      # 400/500 = model not found error (proves semantic type is recognized!)
      # Note: If semantic type was invalid, we'd get "unknown field type" error
      status: [200, 400, 500]

  # Test 2: Verify all semantic field properties are accepted
  - synopsis: Create semantic field with all optional properties.
    path: /{index}
    method: PUT
    parameters:
      index: semantic_schema_test
    request:
      payload:
        mappings:
          properties:
            advanced:
              type: semantic
              model_id: test_model
              search_model_id: search_model
              raw_field_type: text
              semantic_info_field_name: _meta
              semantic_field_search_analyzer: standard
              skip_existing_embedding: true
              chunking: true
              dense_embedding_config:
                data_type: float
                mode: on_disk
              sparse_encoding_config:
                prune_type: top_k
                prune_ratio: 0.5
    response:
      # Accept any of these - we're testing schema acceptance, not functionality
      status: [200, 400, 500]

  # Test 3: Verify chunking array syntax is accepted
  - synopsis: Create semantic field with array chunking configuration.
    path: /{index}
    method: PUT
    parameters:
      index: semantic_schema_test
    request:
      payload:
        mappings:
          properties:
            chunked:
              type: semantic
              model_id: test_model
              chunking:
                - algorithm: fixed
                  parameters:
                    chunk_size: 256
    response:
      status: [200, 400, 500]

  # Test 4: Verify model_selection is accepted without model_id (3.9+)
  # The cluster may still return 400 if plugins.neural_search.model_selection.model_id.sparse.english
  # is unset, same as the placeholder-model_id chapters above.
  - synopsis: Create semantic field with model_selection instead of model_id.
    version: '>= 3.9'
    path: /{index}
    method: PUT
    parameters:
      index: semantic_schema_test
    request:
      payload:
        mappings:
          properties:
            selected:
              type: semantic
              model_selection:
                language_option: ENGLISH
                model_type: SPARSE
    response:
      status: [200, 400, 500]

  # Test 5: Verify a semantic field with neither model_id nor model_selection is accepted (3.9+).
  # The server resolves the default ENGLISH/SPARSE model from cluster settings; it may still
  # return 400 if that default setting is unset, same pattern as the chapters above.
  - synopsis: Create semantic field without model_id or model_selection.
    version: '>= 3.9'
    path: /{index}
    method: PUT
    parameters:
      index: semantic_schema_test
    request:
      payload:
        mappings:
          properties:
            defaulted:
              type: semantic
    response:
      status: [200, 400, 500]

