$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test workload group automatic tagging rule CRUD operations.
version: '>= 3.1'
# The server registers the list and create routes with a trailing slash (`/_rules/{feature_type}/`),
# so the tester normalizes them to a different path than `/_rules/{feature_type}/{id}` and cannot
# map either form to a test file name. Both forms belong to the same rules API, so they are tested together.
warnings:
  invalid-path-detected: false
  multiple-paths-detected: false

prologues:
  - path: /_cluster/settings
    method: PUT
    request:
      payload:
        persistent:
          wlm.workload_group.mode: enabled
  - id: create_workload_group
    path: /_wlm/workload_group/
    method: PUT
    request:
      payload:
        name: api-spec-rules
        resiliency_mode: monitor
        resource_limits:
          cpu: 0.1
          memory: 0.1
    output:
      workload_group_id: payload._id

chapters:
  - id: create_rule
    synopsis: Create a workload group automatic tagging rule.
    path: /_rules/{feature_type}/
    method: PUT
    parameters:
      feature_type: workload_group
    request:
      payload:
        description: Route matching indexes to the API specification workload group.
        index_pattern:
          - api-spec-rules-*
        workload_group: ${create_workload_group.workload_group_id}
    response:
      status: 200
    output:
      rule_id: payload.id
    retry:
      count: 5
      wait: 1000
  - synopsis: List workload group automatic tagging rules.
    path: /_rules/{feature_type}/
    method: GET
    parameters:
      feature_type: workload_group
    response:
      status: 200
  - synopsis: List workload group automatic tagging rules filtered by index pattern.
    path: /_rules/{feature_type}/
    method: GET
    parameters:
      feature_type: workload_group
      index_pattern: api-spec-rules-*
    response:
      status: 200
      payload:
        rules:
          - id: ${create_rule.rule_id}
    retry:
      count: 5
      wait: 1000
  - id: create_principal_rule
    synopsis: Create a rule that matches only a principal.
    version: '>= 3.3'
    path: /_rules/{feature_type}/
    method: PUT
    parameters:
      feature_type: workload_group
    request:
      payload:
        description: Route requests from the API specification user to the workload group.
        principal:
          username:
            - api-spec-user
          role:
            - api-spec-role
        workload_group: ${create_workload_group.workload_group_id}
    response:
      status: 200
      payload:
        principal:
          username:
            - api-spec-user
          role:
            - api-spec-role
    output:
      rule_id: payload.id
  - synopsis: List workload group automatic tagging rules filtered by principal username.
    version: '>= 3.3'
    path: /_rules/{feature_type}/
    method: GET
    parameters:
      feature_type: workload_group
      principal.username: api-spec-user
    response:
      status: 200
      payload:
        rules:
          - id: ${create_principal_rule.rule_id}
    retry:
      count: 5
      wait: 1000
  - synopsis: List workload group automatic tagging rules filtered by principal role.
    version: '>= 3.3'
    path: /_rules/{feature_type}/
    method: GET
    parameters:
      feature_type: workload_group
      principal.role: api-spec-role
    response:
      status: 200
      payload:
        rules:
          - id: ${create_principal_rule.rule_id}
  - synopsis: Delete the principal rule.
    version: '>= 3.3'
    path: /_rules/{feature_type}/{id}
    method: DELETE
    parameters:
      feature_type: workload_group
      id: ${create_principal_rule.rule_id}
    response:
      status: 200
  - synopsis: Retrieve a workload group automatic tagging rule.
    path: /_rules/{feature_type}/{id}
    method: GET
    parameters:
      feature_type: workload_group
      id: ${create_rule.rule_id}
    response:
      status: 200
    retry:
      count: 5
      wait: 1000
  - synopsis: Update a workload group automatic tagging rule.
    path: /_rules/{feature_type}/{id}
    method: PUT
    parameters:
      feature_type: workload_group
      id: ${create_rule.rule_id}
    request:
      payload:
        description: Route updated indexes to the API specification workload group.
        index_pattern:
          - api-spec-rules-updated-*
        workload_group: ${create_workload_group.workload_group_id}
    response:
      status: 200
  - synopsis: Delete a workload group automatic tagging rule.
    path: /_rules/{feature_type}/{id}
    method: DELETE
    parameters:
      feature_type: workload_group
      id: ${create_rule.rule_id}
    response:
      status: 200

epilogues:
  - path: /_rules/{feature_type}/{id}
    method: DELETE
    parameters:
      feature_type: workload_group
      id: ${create_rule.rule_id}
    status: [200, 404]
  # Deleted rules are removed from the in-memory rule cache asynchronously,
  # so the workload group can briefly still appear to be in use.
  - path: /_wlm/workload_group/{name}
    method: DELETE
    parameters:
      name: api-spec-rules
    status: [200, 404]
    retry:
      count: 10
      wait: 2000
