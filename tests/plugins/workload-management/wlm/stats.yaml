$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test the Workload Management Stats API.
version: '>= 2.18'
warnings:
  multiple-paths-detected: false
prologues:
  - path: /_cat/nodes
    id: node
    method: GET
    parameters:
      full_id: true
      format: json
      h: id
    output:
      id: payload[0].id
  - path: /_wlm/query_group/stats_analytics
    method: DELETE
    status: [200, 404]
  - path: /_wlm/query_group
    id: group
    method: PUT
    request:
      payload:
        name: stats_analytics
        resource_limits:
          memory: 0.1
        resiliency_mode: monitor
    output:
      group_id: payload._id
epilogues:
  - path: /_wlm/query_group/stats_analytics
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Get workload management statistics for all nodes and workload groups.
    path: /_wlm/stats
    method: GET
    response:
      status: 200
      payload:
        _nodes:
          failed: 0
  - synopsis: Get workload management statistics for a specific workload group.
    path: /_wlm/stats/{workload_group_id}
    method: GET
    parameters:
      workload_group_id: ${group.group_id}
    response:
      status: 200
      payload:
        _nodes:
          failed: 0
  - synopsis: Get workload management statistics for a specific node.
    path: /_wlm/{node_id}/stats
    method: GET
    parameters:
      node_id: ${node.id}
    response:
      status: 200
      payload:
        _nodes:
          failed: 0
  - synopsis: Get workload management statistics for a specific node and workload group.
    path: /_wlm/{node_id}/stats/{workload_group_id}
    method: GET
    parameters:
      node_id: ${node.id}
      workload_group_id: ${group.group_id}
    response:
      status: 200
      payload:
        _nodes:
          failed: 0
