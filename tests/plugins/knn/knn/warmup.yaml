$schema: ../../../../json_schemas/test_story.schema.yaml

description: Load all the native library files for all the shards into native memory.
version: '>= 3.9.0'
prologues:
  - method: PUT
    path: /movies
    request:
      payload:
        settings:
          index:
            knn: true
        mappings:
          properties:
            recommendation_vector:
              type: knn_vector
              dimension: 8
    status: [200]
  - method: PUT
    path: /lucene-movies
    request:
      payload:
        settings:
          index:
            knn: true
        mappings:
          properties:
            recommendation_vector:
              type: knn_vector
              dimension: 8
              method:
                name: hnsw
                engine: lucene
    status: [200]
epilogues:
  - path: /movies
    method: DELETE
    status: [200, 404]
  - path: /lucene-movies
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Warmup an index.
    method: GET
    path: /_plugins/_knn/warmup/{index}
    parameters:
      index:
        - movies
    response:
      status: 200
  - synopsis: Warmup an index whose k-NN fields all use the Lucene engine, which is skipped.
    method: GET
    path: /_plugins/_knn/warmup/{index}
    parameters:
      index:
        - lucene-movies
    response:
      status: 200
      payload:
        _shards:
          total: 1
          successful: 1
          skipped: 1
          failed: 0
          skip_reasons:
            - lucene_engine
