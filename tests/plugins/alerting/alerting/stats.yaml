$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test retrieving scheduled job stats from all nodes.

chapters:
  - synopsis: Get all scheduled job stats.
    path: /_plugins/_alerting/stats/
    method: GET
    response:
      status: 200
  - synopsis: Get all scheduled job stats with a timeout.
    path: /_plugins/_alerting/stats/
    method: GET
    parameters:
      timeout: 30s
    response:
      status: 200
