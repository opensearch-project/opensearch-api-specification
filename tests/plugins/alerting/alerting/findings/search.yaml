$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test searching the findings of document-level monitors.

version: '>= 2.0'

chapters:
  - synopsis: Search all findings.
    path: /_plugins/_alerting/findings/_search
    method: GET
    response:
      status: 200
  - synopsis: Search findings sorted by ID.
    path: /_plugins/_alerting/findings/_search
    method: GET
    parameters:
      size: 10
      startIndex: 0
      sortString: id
      sortOrder: asc
    response:
      status: 200
