$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test retrieving destinations. Destinations are deprecated in favor of the Notifications plugin's channels, but the read API remains for backwards compatibility.

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: books-alerting-destinations
    status: [200]
  # Create a monitor to assure that the alerting configuration index that destinations are read from exists.
  - path: /_plugins/_alerting/monitors
    id: create_monitor
    method: POST
    request:
      payload:
        name: get-destinations-test
        monitor_type: query_level_monitor
        enabled: true
        schedule:
          period:
            interval: 1
            unit: MINUTES
        inputs:
          - search:
              indices:
                - books-alerting-destinations
              query:
                size: 0
                query:
                  match_all: {}
        triggers:
          - name: get-destinations-test-trigger
            severity: '1'
            condition:
              script:
                source: ctx.results[0].hits.total.value > 10000
                lang: painless
            actions: []
    status: [201]
    output:
      monitor_id: payload._id

epilogues:
  - path: /_plugins/_alerting/monitors/{monitor_id}
    method: DELETE
    status: [200, 404]
    parameters:
      monitor_id: ${create_monitor.monitor_id}
  - path: /books-alerting-destinations
    method: DELETE
    status: [200, 404]

chapters:
  - synopsis: Get all destinations.
    path: /_plugins/_alerting/destinations
    method: GET
    response:
      status: 200
  - synopsis: Get destinations filtered by type.
    path: /_plugins/_alerting/destinations
    method: GET
    parameters:
      destinationType: slack
      size: 10
      startIndex: 0
      sortOrder: asc
    response:
      status: 200
