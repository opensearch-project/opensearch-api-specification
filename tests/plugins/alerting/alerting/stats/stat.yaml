$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test retrieving specific scheduled job stats from all nodes.

chapters:
  - synopsis: Get the job scheduling metrics of all nodes.
    path: /_plugins/_alerting/stats/{stat}
    method: GET
    parameters:
      stat: job_scheduling_metrics
    response:
      status: 200
  - synopsis: Get the jobs info of all nodes.
    path: /_plugins/_alerting/stats/{stat}
    method: GET
    parameters:
      stat: jobs_info
    response:
      status: 200
