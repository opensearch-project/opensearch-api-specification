$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test searching for monitors.

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: books-alerting-search
    status: [200]
  - path: /_plugins/_alerting/monitors
    id: create_monitor
    method: POST
    request:
      payload:
        name: search-monitors-test
        monitor_type: query_level_monitor
        enabled: true
        schedule:
          period:
            interval: 1
            unit: MINUTES
        inputs:
          - search:
              indices:
                - books-alerting-search
              query:
                size: 0
                query:
                  match_all: {}
        triggers:
          - name: search-monitors-test-trigger
            severity: '1'
            condition:
              script:
                source: ctx.results[0].hits.total.value > 10000
                lang: painless
            actions: []
    status: [201]
    output:
      monitor_id: payload._id

epilogues:
  - path: /_plugins/_alerting/monitors/{monitor_id}
    method: DELETE
    status: [200, 404]
    parameters:
      monitor_id: ${create_monitor.monitor_id}
  - path: /books-alerting-search
    method: DELETE
    status: [200, 404]

chapters:
  - synopsis: Search for monitors by name (GET).
    path: /_plugins/_alerting/monitors/_search
    method: GET
    request:
      payload:
        query:
          match:
            monitor.name: search-monitors-test
    response:
      status: 200
  - synopsis: Search for monitors by name (POST).
    path: /_plugins/_alerting/monitors/_search
    method: POST
    request:
      payload:
        query:
          match:
            monitor.name: search-monitors-test
    response:
      status: 200
