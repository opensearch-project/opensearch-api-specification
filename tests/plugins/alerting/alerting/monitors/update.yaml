$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test the update of a monitor.

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: books-alerting-update
    status: [200]
  - path: /_plugins/_alerting/monitors
    id: create_monitor
    method: POST
    request:
      payload:
        name: update-monitor-test
        monitor_type: query_level_monitor
        enabled: true
        schedule:
          period:
            interval: 1
            unit: MINUTES
        inputs:
          - search:
              indices:
                - books-alerting-update
              query:
                size: 0
                query:
                  match_all: {}
        triggers:
          - name: update-monitor-test-trigger
            severity: '1'
            condition:
              script:
                source: ctx.results[0].hits.total.value > 10000
                lang: painless
            actions: []
    status: [201]
    output:
      monitor_id: payload._id

epilogues:
  - path: /_plugins/_alerting/monitors/{monitor_id}
    method: DELETE
    status: [200, 404]
    parameters:
      monitor_id: ${create_monitor.monitor_id}
  - path: /books-alerting-update
    method: DELETE
    status: [200, 404]

chapters:
  - synopsis: Update a monitor's schedule.
    path: /_plugins/_alerting/monitors/{monitor_id}
    method: PUT
    parameters:
      monitor_id: ${create_monitor.monitor_id}
    request:
      payload:
        name: update-monitor-test
        monitor_type: query_level_monitor
        enabled: true
        schedule:
          period:
            interval: 5
            unit: MINUTES
        inputs:
          - search:
              indices:
                - books-alerting-update
              query:
                size: 0
                query:
                  match_all: {}
        triggers:
          - name: update-monitor-test-trigger
            severity: '1'
            condition:
              script:
                source: ctx.results[0].hits.total.value > 10000
                lang: painless
            actions: []
    response:
      status: 200
      payload:
        monitor:
          name: update-monitor-test
