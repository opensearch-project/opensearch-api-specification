$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test retrieving alerts.

chapters:
  - synopsis: Get all alerts.
    path: /_plugins/_alerting/monitors/alerts
    method: GET
    response:
      status: 200
  - synopsis: Get alerts filtered by state, severity, and sort order.
    path: /_plugins/_alerting/monitors/alerts
    method: GET
    parameters:
      alertState: ACTIVE
      severityLevel: '1'
      size: 10
      startIndex: 0
      sortOrder: desc
      sortString: start_time
    response:
      status: 200
