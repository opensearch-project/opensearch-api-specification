$schema: ../../../json_schemas/test_story.schema.yaml

description: Test the singular `_setting` endpoint.
prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: movies
    request:
      payload:
        settings:
          number_of_shards: 1
epilogues:
  - path: /movies
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Get a single setting of an index.
    path: /{index}/_setting/{name}
    method: GET
    parameters:
      index: movies
      name: index.number_of_shards
    response:
      status: 200
      payload:
        movies:
          settings:
            index:
              number_of_shards: '1'
