$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test rolling over aliases.
epilogues:
  - path: /games
    method: DELETE
    status: [200, 404]
  - path: /rollover
    method: DELETE
    status: [200, 404]
prologues:
  - path: games
    method: PUT
  - path: /games/_alias/jeux
    method: POST
chapters:
  - synopsis: Evaluate primary shard rollover conditions without rolling over.
    version: '>= 3.11'
    path: /{alias}/_rollover/{new_index}
    method: POST
    parameters:
      alias: jeux
      new_index: rollover
      dry_run: true
    request:
      payload:
        conditions:
          max_primary_shard_size: 100gb
          max_primary_shard_docs: 1000000
    response:
      status: 200
      payload:
        old_index: games
        new_index: rollover
        dry_run: true
        rolled_over: false
        conditions:
          '[max_primary_shard_size: 100gb]': false
          '[max_primary_shard_docs: 1000000]': false
  - synopsis: Manually roll over an index.
    path: /{alias}/_rollover/{new_index}
    method: POST
    parameters:
      alias: jeux
      new_index: rollover
    response:
      status: 200
      payload:
        acknowledged: true
        old_index: games
        new_index: rollover
        rolled_over: true
