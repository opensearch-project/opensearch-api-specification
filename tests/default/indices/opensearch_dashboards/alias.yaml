$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test the alias APIs exposed under the OpenSearch Dashboards system index prefix.
prologues:
  - path: /_opensearch_dashboards/{index}
    method: PUT
    parameters:
      index: .kibana_spec_test
epilogues:
  - path: /.kibana_spec_test
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Add an alias to an index (PUT /{index}/_alias/{name}).
    path: /_opensearch_dashboards/{index}/_alias/{name}
    method: PUT
    parameters:
      index: .kibana_spec_test
      name: .kibana_spec_alias_1
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Add an alias to an index (POST /{index}/_alias/{name}).
    path: /_opensearch_dashboards/{index}/_alias/{name}
    method: POST
    parameters:
      index: .kibana_spec_test
      name: .kibana_spec_alias_2
    response:
      status: 200
  - synopsis: Add an alias to an index (PUT /{index}/_alias).
    path: /_opensearch_dashboards/{index}/_alias
    method: PUT
    parameters:
      index: .kibana_spec_test
    request:
      payload:
        alias: .kibana_spec_alias_3
    response:
      status: 200
  - synopsis: Add an alias (PUT /_alias/{name}).
    path: /_opensearch_dashboards/_alias/{name}
    method: PUT
    parameters:
      name: .kibana_spec_alias_4
    request:
      payload:
        index: .kibana_spec_test
    response:
      status: 200
  - synopsis: Add an alias (POST /_alias/{name}).
    path: /_opensearch_dashboards/_alias/{name}
    method: POST
    parameters:
      name: .kibana_spec_alias_5
    request:
      payload:
        index: .kibana_spec_test
    response:
      status: 200
  - synopsis: Add an alias (PUT /_alias).
    path: /_opensearch_dashboards/_alias
    method: PUT
    request:
      payload:
        index: .kibana_spec_test
        alias: .kibana_spec_alias_6
    response:
      status: 200
  - synopsis: Get all aliases.
    path: /_opensearch_dashboards/_alias
    method: GET
    response:
      status: 200
  - synopsis: Get an alias by name.
    path: /_opensearch_dashboards/_alias/{name}
    method: GET
    parameters:
      name: .kibana_spec_alias_1
    response:
      status: 200
      payload:
        .kibana_spec_test:
          aliases:
            .kibana_spec_alias_1: {}
  - synopsis: Get the aliases of an index.
    path: /_opensearch_dashboards/{index}/_alias
    method: GET
    parameters:
      index: .kibana_spec_test
    response:
      status: 200
  - synopsis: Get an alias of an index.
    path: /_opensearch_dashboards/{index}/_alias/{name}
    method: GET
    parameters:
      index: .kibana_spec_test
      name: .kibana_spec_alias_1
    response:
      status: 200
  - synopsis: Check whether an alias exists.
    path: /_opensearch_dashboards/_alias/{name}
    method: HEAD
    parameters:
      name: .kibana_spec_alias_1
  - synopsis: Check whether an index has aliases.
    path: /_opensearch_dashboards/{index}/_alias
    method: HEAD
    parameters:
      index: .kibana_spec_test
  - synopsis: Check whether an index has an alias.
    path: /_opensearch_dashboards/{index}/_alias/{name}
    method: HEAD
    parameters:
      index: .kibana_spec_test
      name: .kibana_spec_alias_1
