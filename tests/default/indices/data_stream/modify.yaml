$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test modifying the backing indexes of a data stream.
version: '>= 3.8'
prologues:
  - path: /_index_template/logs-template-modify
    method: PUT
    request:
      payload:
        index_patterns:
          - logs-modify*
        data_stream:
          timestamp_field:
            name: request_time
        priority: 100
  - path: /_data_stream/logs-modify
    method: PUT
  - path: /logs-modify/_rollover
    method: POST
epilogues:
  - path: /_data_stream/logs-modify
    method: DELETE
    status: [200, 404]
  - path: /.ds-logs-modify-000001
    method: DELETE
    status: [200, 404]
  - path: /_index_template/logs-template-modify
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Remove a backing index from a data stream.
    path: /_data_stream/_modify
    method: POST
    request:
      payload:
        actions:
          - remove_backing_index:
              data_stream: logs-modify
              index: .ds-logs-modify-000001
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Add a backing index to a data stream.
    path: /_data_stream/_modify
    method: POST
    request:
      payload:
        actions:
          - add_backing_index:
              data_stream: logs-modify
              index: .ds-logs-modify-000001
    response:
      status: 200
      payload:
        acknowledged: true
