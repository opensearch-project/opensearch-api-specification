$schema: ../../../json_schemas/test_story.schema.yaml

description: Test the plural `_mappings` endpoints.
prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: movies
epilogues:
  - path: /movies
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Update the mappings of an index (PUT).
    path: /{index}/_mappings
    method: PUT
    parameters:
      index: movies
    request:
      payload:
        properties:
          director:
            type: text
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Update the mappings of an index (POST).
    path: /{index}/_mappings
    method: POST
    parameters:
      index: movies
    request:
      payload:
        properties:
          year:
            type: integer
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Get the mappings of an index.
    path: /{index}/_mappings
    method: GET
    parameters:
      index: movies
    response:
      status: 200
      payload:
        movies:
          mappings:
            properties:
              director:
                type: text
              year:
                type: integer
  - synopsis: Get the mappings of all indexes.
    path: /_mappings
    method: GET
    response:
      status: 200
