$schema: ../../../json_schemas/test_story.schema.yaml

description: Test getting the current state of the index. 
prologues:
  - path: /books
    method: PUT
  - id: policy
    path: /_plugins/_ism/policies/rollover
    method: PUT
    request:
      payload:
        policy:
          description: A rollover policy.
          default_state: ingest
          states:
            - name: ingest
              actions:
                - rollover: 
                    min_doc_count: 5
    status: [201]
    output:
      id: payload._id
  - path: /_plugins/_ism/add/books
    method: POST
    request:
      payload:
        policy_id: ${policy.id}
chapters:
  - synopsis: Get the total managed indexes count (GET).
    path: /_plugins/_ism/explain
    method: GET
  - synopsis: Get the total managed indexes count (POST).
    version: '>= 2.12'
    path: /_plugins/_ism/explain
    method: POST
    request:
      payload: {}
  - synopsis: Get the current policy for an index (GET).
    path: /_plugins/_ism/explain/{index}
    method: GET
    parameters:
      index: books
  - synopsis: Get the current policy for an index (POST).
    version: '>= 2.12'
    path: /_plugins/_ism/explain/{index}
    method: POST
    parameters:
      index: books
    request:
      payload: {}
  - synopsis: Get the managed indexes with pagination, sorting and a query string.
    version: '>= 1.3'
    path: /_plugins/_ism/explain
    method: GET
    parameters:
      size: 10
      from: 0
      sortField: managed_index.index
      sortOrder: desc
      queryString: '*'
      local: false
      type: _default
  - synopsis: Get the current policy for an index with its policy and validation result.
    version: '>= 2.4'
    path: /_plugins/_ism/explain/{index}
    method: GET
    parameters:
      index: books
      show_policy: true
      validate_action: true
      cluster_manager_timeout: 30s
  - synopsis: Get the managed indexes that match a filter.
    version: '>= 2.12'
    path: /_plugins/_ism/explain
    method: POST
    request:
      payload:
        filter:
          policy_id: ${policy.id}
          failed: false
epilogues:
  - path: /_plugins/_ism/policies/rollover
    method: DELETE
    status: [200, 404]
  - path: /books
    method: DELETE
    status: [200, 404]
