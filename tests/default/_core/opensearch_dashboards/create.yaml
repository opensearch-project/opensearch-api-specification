$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test the create document API exposed under the OpenSearch Dashboards system index prefix.
epilogues:
  - path: /.kibana_spec_test
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Create a document (PUT).
    path: /_opensearch_dashboards/{index}/_create/{id}
    method: PUT
    parameters:
      index: .kibana_spec_test
      id: '1'
    request:
      payload:
        title: Interstellar
    response:
      status: 201
      payload:
        result: created
  - synopsis: Create a document (POST).
    path: /_opensearch_dashboards/{index}/_create/{id}
    method: POST
    parameters:
      index: .kibana_spec_test
      id: '2'
    request:
      payload:
        title: Inception
    response:
      status: 201
      payload:
        result: created
