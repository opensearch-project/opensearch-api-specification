$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test the Painless context API.

chapters:
  - synopsis: Retrieve all Painless contexts.
    path: /_scripts/painless/_context
    method: GET
    response:
      status: 200
  - synopsis: Retrieve the Painless score context.
    path: /_scripts/painless/_context
    method: GET
    parameters:
      context: score
    response:
      status: 200
