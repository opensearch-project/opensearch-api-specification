$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test multi-search with a per-sub-request search pipeline.
version: '>= 2.9'
prologues:
  - path: /_bulk
    method: POST
    parameters:
      refresh: true
    request:
      content_type: application/x-ndjson
      payload:
        - {create: {_index: books, _id: book1}}
        - {author: Harper Lee, title: To Kill a Mockingbird, year: 1960}
        - {create: {_index: books, _id: book2}}
        - {author: F. Scott Fitzgerald, title: The Great Gatsby, year: 1925}
  - path: /_search/pipeline/msearch_pipeline_test
    method: PUT
    request:
      payload:
        description: No-op pipeline for the msearch search_pipeline test
        request_processors: []
    response:
      status: 200
      payload:
        acknowledged: true
chapters:
  - synopsis: Run msearch with search_pipeline set on the first sub-request body line.
    path: /_msearch
    method:
      - GET
      - POST
    request:
      content_type: application/x-ndjson
      payload:
        - {index: books}
        - {query: {match_all: {}}, search_pipeline: msearch_pipeline_test}
        - {index: books}
        - {query: {match_all: {}}}
    response:
      status: 200
      payload:
        responses:
          - hits:
              total:
                value: 2
                relation: eq
          - hits:
              total:
                value: 2
                relation: eq
epilogues:
  - path: /_search/pipeline/msearch_pipeline_test
    method: DELETE
    status: [200, 404]
  - path: /books
    method: DELETE
    status: [200, 404]
