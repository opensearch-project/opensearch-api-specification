$schema: ../../../../../../json_schemas/test_story.schema.yaml

description: Test a search pipeline with a hybrid_score_explanation response processor.
warnings:
  invalid-path-detected: false
version: '>= 2.19'
prologues:
  - path: /books
    method: PUT
    request:
      payload:
        mappings:
          properties:
            title:
              type: text
            author:
              type: text
  - path: /_bulk
    method: POST
    parameters:
      refresh: true
    request:
      content_type: application/x-ndjson
      payload:
        - {index: {_index: books, _id: book1}}
        - {title: To Kill a Mockingbird, author: Harper Lee}
        - {index: {_index: books, _id: book2}}
        - {title: The Great Gatsby, author: F. Scott Fitzgerald}
epilogues:
  - path: /_search/pipeline/hybrid-explain-pipeline
    method: DELETE
    status: [200, 404]
  - path: /books
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: Create search pipeline with hybrid_score_explanation processor.
    path: /_search/pipeline/{id}
    method: PUT
    parameters:
      id: hybrid-explain-pipeline
    request:
      payload:
        description: Post processor for hybrid search.
        phase_results_processors:
          - normalization-processor:
              normalization:
                technique: min_max
              combination:
                technique: arithmetic_mean
        response_processors:
          - hybrid_score_explanation:
              tag: hybrid-explain
              description: Adds hybrid score explanation to search hits.
              ignore_failure: true
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Get the hybrid score explanation pipeline.
    path: /_search/pipeline/{id}
    method: GET
    parameters:
      id: hybrid-explain-pipeline
    response:
      status: 200
  - synopsis: Search with hybrid query and explain enabled.
    warnings:
      multiple-paths-detected: false
    path: /{index}/_search
    method: GET
    parameters:
      index: books
      search_pipeline: hybrid-explain-pipeline
      explain: true
    request:
      payload:
        query:
          hybrid:
            queries:
              - match:
                  title: Kill
              - match:
                  title: Gatsby
    response:
      status: 200
      payload:
        hits:
          total:
            value: 2
