$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test agentic query schema validation.
# A bare agentic query (no `agentic_query_translator` search processor) is rejected by the server
# on every version since agentic query shipped (3.2+): it returns 400 with "Agentic search query
# must be used ... with agentic_query_translator search processor". Provisioning that processor
# requires an ML agent the default test env does not set up, so this story asserts the 400 guard
# (which exercises agentic-query request-schema validation) rather than a 200 search result.
# Verified against a live 3.8.0 cluster.
version: '>=3.2'
warnings:
  invalid-path-detected: false
prologues:
  - path: /books
    method: PUT
    request:
      payload:
        mappings:
          properties:
            title:
              type: text
            author:
              type: text
            year:
              type: integer

  - path: /_bulk
    method: POST
    parameters:
      refresh: true
    request:
      content_type: application/x-ndjson
      payload:
        - {index: {_index: books, _id: book1}}
        - {title: To Kill a Mockingbird, author: Harper Lee, year: 1960}
        - {index: {_index: books, _id: book2}}
        - {title: '1984', author: George Orwell, year: 1949}
        - {index: {_index: books, _id: book3}}
        - {title: The Great Gatsby, author: F. Scott Fitzgerald, year: 1925}
epilogues:
  - path: /books
    method: DELETE
    status: [200, 404]
chapters:
  - synopsis: A bare agentic query (without an agentic_query_translator processor) is rejected.
    path: /{index}/_search
    method: POST
    parameters:
      index: books
    request:
      payload:
        query:
          agentic:
            query_text: List all the flowers present
            query_fields:
              - author
              - title
    response:
      status: 400
