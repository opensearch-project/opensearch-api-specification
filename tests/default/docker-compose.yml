version: '3'

services:
  opensearch-cluster:
    image: ${OPENSEARCH_DOCKER_HUB_PROJECT:-opensearchproject}/opensearch:${OPENSEARCH_VERSION:-latest}${OPENSEARCH_DOCKER_REF}
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-myStrongPassword123!}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      - discovery.type=single-node
      - http.bind_host=0.0.0.0
      - http.port=9200-9300
      - http.publish_host=_site_
      - http.publish_port=9200
      - network.bind_host=0.0.0.0
      - network.publish_host=_site_
      - transport.bind_host=0.0.0.0
      - transport.port=9300-9400
      - transport.publish_host=_site_
      - transport.publish_port=9300
