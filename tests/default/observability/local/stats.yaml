$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test backend stats.
# Excluded on 3.8.x: GET /_plugins/_observability/_local/stats crashes the node on 3.8.0
# (observability plugin bundles Jackson 3.x jackson-databind next to a Jackson-2.x json-flattener,
# throwing NoClassDefFoundError com/fasterxml/jackson/databind/ObjectMapper -> uncaught -> node exits).
# Upstream distribution defect, not a spec issue. Re-enable once the 3.8 line ships a fix.
version: '>= 2.5 < 3.8.0'

chapters:
  - synopsis: Get observability stats.
    path: /_plugins/_observability/_local/stats
    method: GET
    response:
      status: 200
      content_type: text/plain