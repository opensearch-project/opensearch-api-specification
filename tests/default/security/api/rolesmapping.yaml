$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test rolesmapping endpoint.
distributions:
  excluded:
    - amazon-managed
    - amazon-serverless

prologues:
  - path: /_plugins/_security/api/roles/{role}
    method: PUT
    parameters:
      role: test
    request:
      payload:
        cluster_permissions: 
          - cluster_composite_ops
    status: [201]
  - path: /_plugins/_security/api/roles/{role}
    method: PUT
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_reader
    request:
      payload:
        cluster_permissions: [cluster_monitor]
    status: [200, 201]
  - path: /_plugins/_security/api/roles/{role}
    method: PUT
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_observer
    request:
      payload:
        cluster_permissions: [cluster_monitor]
    status: [200, 201]
chapters:
  - synopsis: Get rolesmapping bulk.
    path: /_plugins/_security/api/rolesmapping
    method: GET
    response:
      status: 200
  - synopsis: Patch rolesmapping bulk.
    path: /_plugins/_security/api/rolesmapping
    method: PATCH
    request:
      payload: 
        - op: add
          path: /all_access
          value: 
            users: [test]
            backend_roles: [admin]
    response:
      status: 200
  - synopsis: Create rolesmapping.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: PUT
    parameters:
      role: test
    request:
      payload:
        backend_roles: [captains]
        hosts: 
          - '*.example.com'
        users: [test]
    response:
      status: 201
  - synopsis: Get rolesmapping.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: GET
    parameters:
      role: test
    response:
      status: 200
  - synopsis: Patch rolesmapping.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: PATCH
    parameters:
      role: test
    request:
      payload: 
        - op: replace
          path: /backend_roles
          value: [admin]
    response:
      status: 200
  - synopsis: Delete rolesmapping.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: DELETE
    parameters:
      role: test
    response:
      status: 200
  - synopsis: Create multiple role mappings.
    path: /_plugins/_security/api/rolesmapping
    method: PUT
    version: '>=3.10'
    parameters:
      wait_for_completion: true
    request:
      payload:
        test_bulk_mapping_reader:
          backend_roles: [analysts]
          users: [jdoe]
        test_bulk_mapping_observer:
          backend_roles: [ops]
          hosts: ['*.monitoring.example.com']
    response:
      status: 200
      payload:
        status: OK
        message: Resources updated.
  - synopsis: Verify a role mapping created in bulk.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_reader
    response:
      status: 200
      payload:
        test_bulk_mapping_reader:
          backend_roles: [analysts]
          users: [jdoe]
  - synopsis: Replace a role mapping without changing omitted mappings.
    path: /_plugins/_security/api/rolesmapping
    method: PUT
    version: '>=3.10'
    request:
      payload:
        test_bulk_mapping_reader:
          backend_roles: [auditors]
    response:
      status: 200
      payload:
        status: OK
        message: Resources updated.
  - synopsis: Verify the supplied role mapping was replaced.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_reader
    response:
      status: 200
      payload:
        test_bulk_mapping_reader:
          backend_roles: [auditors]
          users: []
  - synopsis: Verify the omitted role mapping is unchanged.
    path: /_plugins/_security/api/rolesmapping/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_observer
    response:
      status: 200
      payload:
        test_bulk_mapping_observer:
          backend_roles: [ops]
          hosts: ['*.monitoring.example.com']
  - synopsis: Reject a mapping for a role that does not exist.
    path: /_plugins/_security/api/rolesmapping
    method: PUT
    version: '>=3.10'
    request:
      payload:
        test_bulk_mapping_missing_role:
          backend_roles: [nobody]
    response:
      status: 404
epilogues:
  - path: /_plugins/_security/api/roles/{role}
    method: DELETE
    parameters:
      role: test
    status: [200]
  - path: /_plugins/_security/api/rolesmapping/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_reader
    status: [200, 404]
  - path: /_plugins/_security/api/rolesmapping/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_observer
    status: [200, 404]
  - path: /_plugins/_security/api/roles/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_reader
    status: [200, 404]
  - path: /_plugins/_security/api/roles/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_mapping_observer
    status: [200, 404]
