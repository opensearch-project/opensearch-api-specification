$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test roles endpoints.
distributions:
  excluded:
    - amazon-managed
    - amazon-serverless

epilogues:
  - path: /_plugins/_security/api/roles/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_reader
    status: [200, 404]
  - path: /_plugins/_security/api/roles/{role}
    method: DELETE
    version: '>=3.10'
    parameters:
      role: test_bulk_observer
    status: [200, 404]

chapters:
  - synopsis: Create multiple roles.
    path: /_plugins/_security/api/roles
    method: PUT
    version: '>=3.10'
    parameters:
      wait_for_completion: true
    request:
      payload:
        test_bulk_reader:
          cluster_permissions: []
          index_permissions:
            - index_patterns: ['movies*']
              allowed_actions: [read]
          tenant_permissions: []
        test_bulk_observer:
          cluster_permissions: [cluster_monitor]
          index_permissions: []
          tenant_permissions: []
    response:
      status: 200
      payload:
        status: OK
        message: Resources updated.
  - synopsis: Verify a role created in bulk.
    path: /_plugins/_security/api/roles/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_reader
    response:
      status: 200
      payload:
        test_bulk_reader:
          index_permissions:
            - index_patterns: ['movies*']
              allowed_actions: [read]
  - synopsis: Replace a role without changing omitted roles.
    path: /_plugins/_security/api/roles
    method: PUT
    version: '>=3.10'
    request:
      payload:
        test_bulk_reader:
          cluster_permissions: [cluster_monitor]
          index_permissions: []
          tenant_permissions: []
    response:
      status: 200
      payload:
        status: OK
        message: Resources updated.
  - synopsis: Verify the supplied role was replaced.
    path: /_plugins/_security/api/roles/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_reader
    response:
      status: 200
      payload:
        test_bulk_reader:
          cluster_permissions: [cluster_monitor]
          index_permissions: []
          tenant_permissions: []
  - synopsis: Verify the omitted role is unchanged.
    path: /_plugins/_security/api/roles/{role}
    method: GET
    version: '>=3.10'
    parameters:
      role: test_bulk_observer
    response:
      status: 200
      payload:
        test_bulk_observer:
          cluster_permissions: [cluster_monitor]
          index_permissions: []
          tenant_permissions: []
  - synopsis: Create role.
    path: /_plugins/_security/api/roles/{role}
    method: PUT
    parameters:
      role: test
    request:
      payload:
        cluster_permissions: 
          - cluster_composite_ops
          - indices_monitor
        index_permissions: 
          - index_patterns: 
              - 'movies*'
            dls: ''
            fls: []
            masked_fields: []
            allowed_actions: 
              - read
        tenant_permissions: 
          - tenant_patterns: 
              - human_resources
            allowed_actions: 
              - kibana_all_read
    response:
      status: 201
  - synopsis: Get roles bulk.
    path: /_plugins/_security/api/roles
    method: GET
    response:
      status: 200
  - synopsis: Patch roles bulk.
    path: /_plugins/_security/api/roles
    method: PATCH
    request:
      payload: 
        - op: add
          path: /test/index_permissions/0/fls
          value:
            - 'random*'
            - ~random1
    response:
      status: 200
  - synopsis: Get role.
    path: /_plugins/_security/api/roles/{role}
    method: GET
    parameters:
      role: test
    response:
      status: 200
  - synopsis: Patch role.
    path: /_plugins/_security/api/roles/{role}
    method: PATCH
    parameters:
      role: test
    request:
      payload:
        - op: add
          path: /index_permissions/0/fls
          value:
            - 'random*'
            - ~random1
    response:
      status: 200
  - synopsis: Delete role.
    path: /_plugins/_security/api/roles/{role}
    method: DELETE
    parameters:
      role: test
    response:
      status: 200
