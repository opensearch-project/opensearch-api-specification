$schema: ../../../json_schemas/test_story.schema.yaml

description: Test whoamiprotected endpoint.
version: '> 2.10'
distributions:
  excluded:
    - amazon-managed
    - amazon-serverless
prologues:
  - path: /_plugins/_security/api/internalusers/{username}
    method: PUT
    parameters:
      username: no_perm_whoami
    request:
      payload:
        password: myStrongPassword123!
        opendistro_security_roles: []
        backend_roles: []
        attributes: {}
    status: [200, 201]
epilogues:
  - path: /_plugins/_security/api/internalusers/{username}
    method: DELETE
    parameters:
      username: no_perm_whoami
    status: [200, 404]
chapters:
  - synopsis: Get current user info from protected endpoint.
    path: /_plugins/_security/whoamiprotected
    method: GET
    response:
      status: 200
      payload:
        dn: null
        is_admin: false
        is_node_certificate_request: false
  - synopsis: Get current user info from protected endpoint as a user without the permission.
    path: /_plugins/_security/whoamiprotected
    method: GET
    version: '>= 3.10'
    request:
      headers:
        Authorization: Basic bm9fcGVybV93aG9hbWk6bXlTdHJvbmdQYXNzd29yZDEyMyE=
    response:
      status: 403
      content_type: text/plain
