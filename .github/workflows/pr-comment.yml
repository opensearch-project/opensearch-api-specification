name: Comment on PR

on:
  workflow_run:
    workflows:
      - Analyze PR Changes
      - Test Spec
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: |
            .github

      - name: Download PR Comment Payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-comment
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse Payload
        shell: bash -eo pipefail {0}
        run: |
          PR_NUMBER=$(jq -r '.pr_number' ./pr-comment.json)
          COMMENT_IDENTIFIER=$(jq -r '.comment_identifier' ./pr-comment.json)
          TEMPLATE_NAME=$(jq -r '.template_name' ./pr-comment.json)
          TEMPLATE_DATA=$(jq -c '.template_data' ./pr-comment.json)
          
          vars=(
            PR_NUMBER
            COMMENT_IDENTIFIER
            TEMPLATE_NAME
            TEMPLATE_DATA
          )
          
          {
            for var in "${vars[@]}"
            do
              echo "${var}=${!var}"
            done
          } | tee "$GITHUB_ENV"

      - name: Render Comment Template
        uses: chuhlomin/render-template@a7c644e341797d050d1cb24332d83791b9a46dae # v1.12
        id: render
        with:
          template: .github/pr-comment-templates/${{ env.TEMPLATE_NAME }}.template.md
          vars: ${{ env.TEMPLATE_DATA }}

      - name: Find Existing Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: 'github-actions[bot]'
          body-includes: ${{ env.COMMENT_IDENTIFIER }}

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ env.PR_NUMBER }}
          body: ${{ steps.render.outputs.result }}
          edit-mode: replace
