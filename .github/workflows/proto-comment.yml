name: Proto Compatibility Comment

on:
  workflow_run:
    workflows:
      - Proto Compatibility Check
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: |
            .github

      - name: Download Proto Comment Payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: proto-comment-payload
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse Payload
        shell: bash -eo pipefail {0}
        run: |
          PR_NUMBER=$(jq -r '.pr_number' ./proto-comment-payload.json)
          REPORT=$(jq -r '.report' ./proto-comment-payload.json)

          vars=(
            PR_NUMBER
          )

          {
            for var in "${vars[@]}"
            do
              echo "${var}=${!var}"
            done
          } | tee "$GITHUB_ENV"

          # Save report to environment variable
          echo "REPORT_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$REPORT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Find Existing Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: 'github-actions[bot]'
          body-includes: Proto Compatibility Report

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ env.PR_NUMBER }}
          body: |
            ## Proto Compatibility Report

            ${{ env.REPORT_CONTENT }}

            ---
            *Generated by Proto Compatibility Check*
          edit-mode: replace
