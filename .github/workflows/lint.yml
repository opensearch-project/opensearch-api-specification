name: Lint

on:
  push:
    branches: ['**']
    paths:
      - '**/*.ts'
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:
    branches: ['**']
    paths:
      - '**/*.ts'
      - '**/*.yaml'
      - '**/*.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
