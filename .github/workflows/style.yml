name: Style

on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare for Vale (spec)
        run: npm run style:prepare -- --source spec

      - name: Prepare for Vale (test)
        run: npm run style:prepare -- --source tests

      - name: Check Style
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.7.1
          vale_flags: --ignore-syntax
          files: '["spec", "tests"]'
