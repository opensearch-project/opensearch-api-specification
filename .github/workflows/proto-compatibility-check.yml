name: Proto Compatibility Check

on:
  pull_request:
    paths:
      - 'spec/**'

jobs:
  build-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate merged OpenAPI spec
        run: npm run merge -- --source ./spec --output ./build/opensearch-openapi.yaml

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: ./build/opensearch-openapi.yaml
          retention-days: 7

  compatibility-report:
    # Temporarily disabled while the reusable workflow depends on unpinned actions
    # that are blocked by this repository's action pinning policy.
    if: ${{ false }}
    needs: build-spec
    uses: opensearch-project/opensearch-protobufs/.github/workflows/backward-compatible-report.yml@c85ee313c1b3e311e6b3886ddad96d356ce1e532 # main
    with:
      spec_artifact_name: openapi-spec

  upload-report:
    if: ${{ false }}
    needs: compatibility-report
    runs-on: ubuntu-latest
    steps:
      - name: Create Report Payload
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p reports

          # Save report to file first
          cat > reports/report.txt << 'EOF'
          ${{ needs.compatibility-report.outputs.report }}
          EOF

          # Create JSON payload with PR number and report from file
          jq -n \
            --arg pr_number "${{ github.event.pull_request.number }}" \
            --rawfile report reports/report.txt \
            '{
              "pr_number": ($pr_number | tonumber),
              "report": $report
            }' > reports/proto-comment-payload.json

          echo "JSON Payload created:"
          cat reports/proto-comment-payload.json

      - name: Upload Report Payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proto-comment-payload
          path: reports/proto-comment-payload.json
          retention-days: 1
