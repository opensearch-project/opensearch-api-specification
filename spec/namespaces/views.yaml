openapi: 3.1.0
info:
  title: OpenSearch Views API
  description: Experimental APIs for creating and managing views.
  version: 1.0.0
paths:
  /views:
    get:
      operationId: views.list.0
      x-operation-group: views.list
      x-version-added: '3.0'
      description: Returns the names of all views.
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/views.list@200'
    post:
      operationId: views.create.0
      x-operation-group: views.create
      x-version-added: '3.0'
      description: Creates a view.
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/views.create'
      responses:
        '200':
          $ref: '#/components/responses/views.create@200'
  /views/{view_name}:
    get:
      operationId: views.get.0
      x-operation-group: views.get
      x-version-added: '3.0'
      description: Returns a view by name.
      parameters:
        - $ref: '#/components/parameters/views.get::path.view_name'
      responses:
        '200':
          $ref: '#/components/responses/views.get@200'
    put:
      operationId: views.update.0
      x-operation-group: views.update
      x-version-added: '3.0'
      description: Updates a view.
      parameters:
        - $ref: '#/components/parameters/views.update::path.view_name'
      requestBody:
        $ref: '#/components/requestBodies/views.update'
      responses:
        '200':
          $ref: '#/components/responses/views.update@200'
    delete:
      operationId: views.delete.0
      x-operation-group: views.delete
      x-version-added: '3.0'
      description: Deletes a view.
      parameters:
        - $ref: '#/components/parameters/views.delete::path.view_name'
      responses:
        '200':
          $ref: '#/components/responses/views.delete@200'
  /views/{view_name}/_search:
    get:
      operationId: views.search.0
      x-operation-group: views.search
      x-version-added: '3.0'
      description: Searches the indexes targeted by a view.
      externalDocs:
        url: https://docs.opensearch.org/latest/api-reference/search/
      parameters:
        - $ref: '#/components/parameters/views.search::path.view_name'
        - $ref: '#/components/parameters/views.search::query._source'
        - $ref: '#/components/parameters/views.search::query._source_excludes'
        - $ref: '#/components/parameters/views.search::query._source_includes'
        - $ref: '#/components/parameters/views.search::query.allow_no_indices'
        - $ref: '#/components/parameters/views.search::query.allow_partial_search_results'
        - $ref: '#/components/parameters/views.search::query.analyze_wildcard'
        - $ref: '#/components/parameters/views.search::query.analyzer'
        - $ref: '#/components/parameters/views.search::query.batched_reduce_size'
        - $ref: '#/components/parameters/views.search::query.cancel_after_time_interval'
        - $ref: '#/components/parameters/views.search::query.ccs_minimize_roundtrips'
        - $ref: '#/components/parameters/views.search::query.default_operator'
        - $ref: '#/components/parameters/views.search::query.df'
        - $ref: '#/components/parameters/views.search::query.docvalue_fields'
        - $ref: '#/components/parameters/views.search::query.expand_wildcards'
        - $ref: '#/components/parameters/views.search::query.explain'
        - $ref: '#/components/parameters/views.search::query.from'
        - $ref: '#/components/parameters/views.search::query.ignore_throttled'
        - $ref: '#/components/parameters/views.search::query.ignore_unavailable'
        - $ref: '#/components/parameters/views.search::query.include_named_queries_score'
        - $ref: '#/components/parameters/views.search::query.index'
        - $ref: '#/components/parameters/views.search::query.lenient'
        - $ref: '#/components/parameters/views.search::query.max_concurrent_shard_requests'
        - $ref: '#/components/parameters/views.search::query.phase_took'
        - $ref: '#/components/parameters/views.search::query.pre_filter_shard_size'
        - $ref: '#/components/parameters/views.search::query.preference'
        - $ref: '#/components/parameters/views.search::query.q'
        - $ref: '#/components/parameters/views.search::query.request_cache'
        - $ref: '#/components/parameters/views.search::query.rest_total_hits_as_int'
        - $ref: '#/components/parameters/views.search::query.routing'
        - $ref: '#/components/parameters/views.search::query.scroll'
        - $ref: '#/components/parameters/views.search::query.search_pipeline'
        - $ref: '#/components/parameters/views.search::query.search_type'
        - $ref: '#/components/parameters/views.search::query.seq_no_primary_term'
        - $ref: '#/components/parameters/views.search::query.size'
        - $ref: '#/components/parameters/views.search::query.sort'
        - $ref: '#/components/parameters/views.search::query.stats'
        - $ref: '#/components/parameters/views.search::query.stored_fields'
        - $ref: '#/components/parameters/views.search::query.suggest_field'
        - $ref: '#/components/parameters/views.search::query.suggest_mode'
        - $ref: '#/components/parameters/views.search::query.suggest_size'
        - $ref: '#/components/parameters/views.search::query.suggest_text'
        - $ref: '#/components/parameters/views.search::query.terminate_after'
        - $ref: '#/components/parameters/views.search::query.timeout'
        - $ref: '#/components/parameters/views.search::query.track_scores'
        - $ref: '#/components/parameters/views.search::query.track_total_hits'
        - $ref: '#/components/parameters/views.search::query.typed_keys'
        - $ref: '#/components/parameters/views.search::query.verbose_pipeline'
        - $ref: '#/components/parameters/views.search::query.version'
      requestBody:
        $ref: '#/components/requestBodies/views.search'
      responses:
        '200':
          $ref: '#/components/responses/views.search@200'
        '400':
          $ref: '#/components/responses/views.search@400'
        '404':
          $ref: '#/components/responses/views.search@404'
    post:
      operationId: views.search.1
      x-operation-group: views.search
      x-version-added: '3.0'
      description: Searches the indexes targeted by a view.
      externalDocs:
        url: https://docs.opensearch.org/latest/api-reference/search/
      parameters:
        - $ref: '#/components/parameters/views.search::path.view_name'
        - $ref: '#/components/parameters/views.search::query._source'
        - $ref: '#/components/parameters/views.search::query._source_excludes'
        - $ref: '#/components/parameters/views.search::query._source_includes'
        - $ref: '#/components/parameters/views.search::query.allow_no_indices'
        - $ref: '#/components/parameters/views.search::query.allow_partial_search_results'
        - $ref: '#/components/parameters/views.search::query.analyze_wildcard'
        - $ref: '#/components/parameters/views.search::query.analyzer'
        - $ref: '#/components/parameters/views.search::query.batched_reduce_size'
        - $ref: '#/components/parameters/views.search::query.cancel_after_time_interval'
        - $ref: '#/components/parameters/views.search::query.ccs_minimize_roundtrips'
        - $ref: '#/components/parameters/views.search::query.default_operator'
        - $ref: '#/components/parameters/views.search::query.df'
        - $ref: '#/components/parameters/views.search::query.docvalue_fields'
        - $ref: '#/components/parameters/views.search::query.expand_wildcards'
        - $ref: '#/components/parameters/views.search::query.explain'
        - $ref: '#/components/parameters/views.search::query.from'
        - $ref: '#/components/parameters/views.search::query.ignore_throttled'
        - $ref: '#/components/parameters/views.search::query.ignore_unavailable'
        - $ref: '#/components/parameters/views.search::query.include_named_queries_score'
        - $ref: '#/components/parameters/views.search::query.index'
        - $ref: '#/components/parameters/views.search::query.lenient'
        - $ref: '#/components/parameters/views.search::query.max_concurrent_shard_requests'
        - $ref: '#/components/parameters/views.search::query.phase_took'
        - $ref: '#/components/parameters/views.search::query.pre_filter_shard_size'
        - $ref: '#/components/parameters/views.search::query.preference'
        - $ref: '#/components/parameters/views.search::query.q'
        - $ref: '#/components/parameters/views.search::query.request_cache'
        - $ref: '#/components/parameters/views.search::query.rest_total_hits_as_int'
        - $ref: '#/components/parameters/views.search::query.routing'
        - $ref: '#/components/parameters/views.search::query.scroll'
        - $ref: '#/components/parameters/views.search::query.search_pipeline'
        - $ref: '#/components/parameters/views.search::query.search_type'
        - $ref: '#/components/parameters/views.search::query.seq_no_primary_term'
        - $ref: '#/components/parameters/views.search::query.size'
        - $ref: '#/components/parameters/views.search::query.sort'
        - $ref: '#/components/parameters/views.search::query.stats'
        - $ref: '#/components/parameters/views.search::query.stored_fields'
        - $ref: '#/components/parameters/views.search::query.suggest_field'
        - $ref: '#/components/parameters/views.search::query.suggest_mode'
        - $ref: '#/components/parameters/views.search::query.suggest_size'
        - $ref: '#/components/parameters/views.search::query.suggest_text'
        - $ref: '#/components/parameters/views.search::query.terminate_after'
        - $ref: '#/components/parameters/views.search::query.timeout'
        - $ref: '#/components/parameters/views.search::query.track_scores'
        - $ref: '#/components/parameters/views.search::query.track_total_hits'
        - $ref: '#/components/parameters/views.search::query.typed_keys'
        - $ref: '#/components/parameters/views.search::query.verbose_pipeline'
        - $ref: '#/components/parameters/views.search::query.version'
      requestBody:
        $ref: '#/components/requestBodies/views.search'
      responses:
        '200':
          $ref: '#/components/responses/views.search@200'
        '400':
          $ref: '#/components/responses/views.search@400'
        '404':
          $ref: '#/components/responses/views.search@404'
components:
  parameters:
    views.get::path.view_name: &views_path_view_name
      in: path
      name: view_name
      required: true
      description: The view name.
      schema:
        type: string
    views.update::path.view_name: *views_path_view_name
    views.delete::path.view_name: *views_path_view_name
    views.search::path.view_name:
      in: path
      name: view_name
      description: The view whose target indexes are searched.
      required: true
      schema:
        type: string
    views.search::query._source:
      in: query
      name: _source
      description: |-
        Indicates which source fields are returned for matching documents.
        These fields are returned in the `hits._source` property of the search response.
        Valid values are:
        `true` to return the entire document source;
        `false` to not return the document source;
        `<string>` to return the source fields that are specified as a comma-separated list (supports wildcard (`*`) patterns).
      schema:
        $ref: ../schemas/_core.search.yaml#/components/schemas/SourceConfigParam
      style: form
    views.search::query._source_excludes:
      in: query
      name: _source_excludes
      description: |-
        A comma-separated list of source fields to exclude from the response.
        You can also use this parameter to exclude fields from the subset specified in `_source_includes` query parameter.
        If the `_source` parameter is `false`, this parameter is ignored.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Fields
      style: form
    views.search::query._source_includes:
      in: query
      name: _source_includes
      description: |-
        A comma-separated list of source fields to include in the response.
        If this parameter is specified, only these source fields are returned.
        You can exclude fields from this subset using the `_source_excludes` query parameter.
        If the `_source` parameter is `false`, this parameter is ignored.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Fields
      style: form
    views.search::query.allow_no_indices:
      in: query
      name: allow_no_indices
      description: |-
        If `false`, the request returns an error if any wildcard expression, index alias, or `_all` value targets only missing or closed indexes.
        This behavior applies even if the request targets other open indexes.
        For example, a request targeting `foo*,bar*` returns an error if an index starts with `foo` but no index starts with `bar`.
      schema:
        type: boolean
      style: form
    views.search::query.allow_partial_search_results:
      in: query
      name: allow_partial_search_results
      description: If `true`, returns partial results if there are shard request timeouts or shard failures. If `false`, returns an error with no partial results.
      schema:
        type: boolean
        default: true
      style: form
    views.search::query.analyze_wildcard:
      in: query
      name: analyze_wildcard
      description: |-
        If `true`, wildcard and prefix queries are analyzed.
        This parameter can only be used when the q query string parameter is specified.
      schema:
        type: boolean
        default: false
      style: form
    views.search::query.analyzer:
      in: query
      name: analyzer
      description: |-
        Analyzer to use for the query string.
        This parameter can only be used when the q query string parameter is specified.
      schema:
        type: string
      style: form
      x-protobuf-excluded: true
    views.search::query.batched_reduce_size:
      in: query
      name: batched_reduce_size
      description: |-
        The number of shard results that should be reduced at once on the coordinating node.
        This value should be used as a protection mechanism to reduce the memory overhead per search request if the potential number of shards in the request can be large.
      schema:
        type: integer
        format: int32
        default: 512
      style: form
    views.search::query.cancel_after_time_interval:
      in: query
      name: cancel_after_time_interval
      description: |-
        The time after which the search request will be canceled.
        Request-level parameter takes precedence over `cancel_after_time_interval` cluster setting.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Duration
      style: form
    views.search::query.ccs_minimize_roundtrips:
      in: query
      name: ccs_minimize_roundtrips
      description: If `true`, network round-trips between the coordinating node and the remote clusters are minimized when executing cross-cluster search (CCS) requests.
      schema:
        type: boolean
        default: true
      style: form
    views.search::query.default_operator:
      in: query
      name: default_operator
      description: |-
        The default operator for query string query: AND or OR.
        This parameter can only be used when the `q` query string parameter is specified.
      schema:
        $ref: ../schemas/_common.query_dsl.yaml#/components/schemas/Operator
      style: form
    views.search::query.df:
      in: query
      name: df
      description: |-
        Field to use as default where no field prefix is given in the query string.
        This parameter can only be used when the q query string parameter is specified.
      schema:
        type: string
      style: form
    views.search::query.docvalue_fields:
      in: query
      name: docvalue_fields
      description: A comma-separated list of fields to return as the docvalue representation for each hit.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Fields
      style: form
    views.search::query.expand_wildcards:
      in: query
      name: expand_wildcards
      description: |-
        Type of index that wildcard patterns can match.
        If the request can target data streams, this argument determines whether wildcard expressions match hidden data streams.
        Supports comma-separated values, such as `open,hidden`.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/ExpandWildcards
      style: form
    views.search::query.explain:
      in: query
      name: explain
      description: If `true`, returns detailed information about score computation as part of a hit.
      schema:
        type: boolean
      style: form
      x-protobuf-excluded: true
    views.search::query.from:
      in: query
      name: from
      description: |-
        Starting document offset.
        Needs to be non-negative.
        By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.
        To page through more hits, use the `search_after` parameter.
      schema:
        type: integer
        format: int32
        default: 0
      style: form
      x-protobuf-excluded: true
    views.search::query.ignore_throttled:
      in: query
      name: ignore_throttled
      description: If `true`, concrete, expanded or aliased indexes will be ignored when frozen.
      schema:
        type: boolean
      style: form
    views.search::query.ignore_unavailable:
      in: query
      name: ignore_unavailable
      description: If `false`, the request returns an error if it targets a missing or closed index.
      schema:
        type: boolean
      style: form
    views.search::query.include_named_queries_score:
      name: include_named_queries_score
      in: query
      description: Indicates whether `hit.matched_queries` should be rendered as a map that includes the name of the matched query associated with its score (true) or as an array containing the name of the matched queries (false)
      schema:
        type: boolean
        default: false
        description: Indicates whether `hit.matched_queries` should be rendered as a map that includes the name of the matched query associated with its score (true) or as an array containing the name of the matched queries (false)
      x-protobuf-excluded: true
    views.search::query.index:
      in: query
      name: index
      description: |-
        A comma-separated list of data streams, indexes, and aliases to search.
        Supports wildcards (`*`).
        To search all data streams and indexes, omit this parameter or use `*` or `_all`.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Indices
      style: form
    views.search::query.lenient:
      in: query
      name: lenient
      description: |-
        If `true`, format-based query failures (such as providing text to a numeric field) in the query string will be ignored.
        This parameter can only be used when the `q` query string parameter is specified.
      schema:
        type: boolean
      style: form
      x-protobuf-excluded: true
    views.search::query.max_concurrent_shard_requests:
      in: query
      name: max_concurrent_shard_requests
      description: |-
        Defines the number of concurrent shard requests per node this search executes concurrently.
        This value should be used to limit the impact of the search on the cluster in order to limit the number of concurrent shard requests.
      schema:
        type: integer
        format: int32
        default: 5
      style: form
    views.search::query.phase_took:
      name: phase_took
      in: query
      description: Indicates whether to return phase-level `took` time values in the response.
      schema:
        type: boolean
        default: false
      style: form
    views.search::query.pre_filter_shard_size:
      in: query
      name: pre_filter_shard_size
      description: |-
        Defines a threshold that enforces a pre-filter roundtrip to prefilter search shards based on query rewriting if the number of shards the search request expands to exceeds the threshold.
        This filter roundtrip can limit the number of shards significantly if for instance a shard can not match any documents based on its rewrite method (if date filters are mandatory to match but the shard bounds and the query are disjoint).
        When unspecified, the pre-filter phase is executed if any of these conditions is met:
        the request targets more than 128 shards;
        the request targets one or more read-only index;
        the primary sort of the query targets an indexed field.
      schema:
        type: integer
        format: int32
      style: form
    views.search::query.preference:
      in: query
      name: preference
      description: |-
        Nodes and shards used for the search.
        By default, OpenSearch selects from eligible nodes and shards using adaptive replica selection, accounting for allocation awareness. Valid values are:
        `_only_local` to run the search only on shards on the local node;
        `_local` to, if possible, run the search on shards on the local node, or if not, select shards using the default method;
        `_only_nodes:<node-id>,<node-id>` to run the search on only the specified nodes IDs, where, if suitable shards exist on more than one selected node, use shards on those nodes using the default method, or if none of the specified nodes are available, select shards from any available node using the default method;
        `_prefer_nodes:<node-id>,<node-id>` to if possible, run the search on the specified nodes IDs, or if not, select shards using the default method;
        `_shards:<shard>,<shard>` to run the search only on the specified shards;
        `<custom-string>` (any string that does not start with `_`) to route searches with the same `<custom-string>` to the same shards in the same order.
      schema:
        type: string
        default: random
      style: form
    views.search::query.q:
      in: query
      name: q
      description: |-
        Query in the Lucene query string syntax using query parameter search.
        Query parameter searches do not support the full OpenSearch Query DSL but are handy for testing.
      schema:
        type: string
      style: form
    views.search::query.request_cache:
      in: query
      name: request_cache
      description: |-
        If `true`, the caching of search results is enabled for requests where `size` is `0`.
        Defaults to index level settings.
      schema:
        type: boolean
      style: form
    views.search::query.rest_total_hits_as_int:
      in: query
      name: rest_total_hits_as_int
      description: Indicates whether `hits.total` should be rendered as an integer or an object in the rest search response.
      schema:
        type: boolean
        default: false
      style: form
      x-protobuf-name: total_hits_as_int
    views.search::query.routing:
      in: query
      name: routing
      description: A custom value used to route operations to a specific shard.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/RoutingInQueryString
      style: form
    views.search::query.scroll:
      in: query
      name: scroll
      description: |-
        Period to retain the search context for scrolling. See Scroll search results.
        By default, this value cannot exceed `1d` (24 hours).
        You can change this limit using the `search.max_keep_alive` cluster-level setting.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Duration
      style: form
    views.search::query.search_pipeline:
      name: search_pipeline
      in: query
      description: Customizable sequence of processing stages applied to search queries.
      schema:
        type: string
        description: Customizable sequence of processing stages applied to search queries.
      x-protobuf-excluded: true
    views.search::query.search_type:
      in: query
      name: search_type
      description: How distributed term frequencies are calculated for relevance scoring.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/SearchType
      style: form
    views.search::query.seq_no_primary_term:
      in: query
      name: seq_no_primary_term
      description: If `true`, returns sequence number and primary term of the last modification of each hit.
      schema:
        type: boolean
      style: form
      x-protobuf-excluded: true
    views.search::query.size:
      in: query
      name: size
      description: |-
        Defines the number of hits to return.
        By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.
        To page through more hits, use the `search_after` parameter.
      schema:
        type: integer
        format: int32
        default: 10
      style: form
      x-protobuf-excluded: true
    views.search::query.sort:
      in: query
      name: sort
      description: A comma-separated list of <field>:<direction> pairs.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/StringOrStringArray
      style: form
      x-protobuf-excluded: true
    views.search::query.stats:
      in: query
      name: stats
      description: Specific `tag` of the request for logging and statistical purposes.
      schema:
        type: array
        items:
          type: string
      style: form
      x-protobuf-excluded: true
    views.search::query.stored_fields:
      in: query
      name: stored_fields
      description: |-
        A comma-separated list of stored fields to return as part of a hit.
        If no fields are specified, no stored fields are included in the response.
        If this field is specified, the `_source` parameter defaults to `false`.
        You can pass `_source: true` to return both source fields and stored fields in the search response.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Fields
      style: form
      x-protobuf-excluded: true
    views.search::query.suggest_field:
      in: query
      name: suggest_field
      description: Specifies which field to use for suggestions.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/Field
      style: form
    views.search::query.suggest_mode:
      in: query
      name: suggest_mode
      description: |-
        Specifies the suggest mode.
        This parameter can only be used when the `suggest_field` and `suggest_text` query string parameters are specified.
      schema:
        $ref: ../schemas/_common.yaml#/components/schemas/SuggestMode
      style: form
    views.search::query.suggest_size:
      in: query
      name: suggest_size
      description: |-
        Number of suggestions to return.
        This parameter can only be used when the `suggest_field` and `suggest_text` query string parameters are specified.
      schema:
        type: integer
        format: int32
      style: form
    views.search::query.suggest_text:
      in: query
      name: suggest_text
      description: |-
        The source text for which the suggestions should be returned.
        This parameter can only be used when the `suggest_field` and `suggest_text` query string parameters are specified.
      schema:
        type: string
      style: form
    views.search::query.terminate_after:
      in: query
      name: terminate_after
      description: |-
        Maximum number of documents to collect for each shard.
        If a query reaches this limit, OpenSearch terminates the query early.
