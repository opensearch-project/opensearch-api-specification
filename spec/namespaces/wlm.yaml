openapi: 3.1.0
info:
  title: Workload Management Query Group API
  description: The Query Group Lifecycle APIs create, update, and delete workload management query groups.
  version: 1.0.0
paths:
  /_list/wlm_stats:
    get:
      operationId: wlm.stats_list.0
      x-operation-group: wlm.stats_list
      x-version-added: '3.1'
      description: Returns paginated workload management statistics in a tabular format.
      parameters:
        - $ref: '#/components/parameters/wlm.stats_list::query.boolean'
        - $ref: '#/components/parameters/wlm.stats_list::query.breach'
        - $ref: '#/components/parameters/wlm.stats_list::query.next_token'
        - $ref: '#/components/parameters/wlm.stats_list::query.order'
        - $ref: '#/components/parameters/wlm.stats_list::query.size'
        - $ref: '#/components/parameters/wlm.stats_list::query.sort'
        - $ref: '#/components/parameters/wlm.stats_list::query.v'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats_list@200'
        '400':
          $ref: '#/components/responses/wlm.stats_list@400'
  /_list/wlm_stats/stats/{workload_group_id}:
    get:
      operationId: wlm.stats_list.1
      x-operation-group: wlm.stats_list
      x-version-added: '3.1'
      description: Returns paginated workload management statistics in a tabular format.
      parameters:
        - $ref: '#/components/parameters/wlm.stats_list::path.workload_group_id'
        - $ref: '#/components/parameters/wlm.stats_list::query.boolean'
        - $ref: '#/components/parameters/wlm.stats_list::query.breach'
        - $ref: '#/components/parameters/wlm.stats_list::query.next_token'
        - $ref: '#/components/parameters/wlm.stats_list::query.order'
        - $ref: '#/components/parameters/wlm.stats_list::query.size'
        - $ref: '#/components/parameters/wlm.stats_list::query.sort'
        - $ref: '#/components/parameters/wlm.stats_list::query.v'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats_list@200'
        '400':
          $ref: '#/components/responses/wlm.stats_list@400'
  /_list/wlm_stats/{node_id}/stats:
    get:
      operationId: wlm.stats_list.2
      x-operation-group: wlm.stats_list
      x-version-added: '3.1'
      description: Returns paginated workload management statistics in a tabular format.
      parameters:
        - $ref: '#/components/parameters/wlm.stats_list::path.node_id'
        - $ref: '#/components/parameters/wlm.stats_list::query.boolean'
        - $ref: '#/components/parameters/wlm.stats_list::query.breach'
        - $ref: '#/components/parameters/wlm.stats_list::query.next_token'
        - $ref: '#/components/parameters/wlm.stats_list::query.order'
        - $ref: '#/components/parameters/wlm.stats_list::query.size'
        - $ref: '#/components/parameters/wlm.stats_list::query.sort'
        - $ref: '#/components/parameters/wlm.stats_list::query.v'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats_list@200'
        '400':
          $ref: '#/components/responses/wlm.stats_list@400'
  /_list/wlm_stats/{node_id}/stats/{workload_group_id}:
    get:
      operationId: wlm.stats_list.3
      x-operation-group: wlm.stats_list
      x-version-added: '3.1'
      description: Returns paginated workload management statistics in a tabular format.
      parameters:
        - $ref: '#/components/parameters/wlm.stats_list::path.node_id'
        - $ref: '#/components/parameters/wlm.stats_list::path.workload_group_id'
        - $ref: '#/components/parameters/wlm.stats_list::query.boolean'
        - $ref: '#/components/parameters/wlm.stats_list::query.breach'
        - $ref: '#/components/parameters/wlm.stats_list::query.next_token'
        - $ref: '#/components/parameters/wlm.stats_list::query.order'
        - $ref: '#/components/parameters/wlm.stats_list::query.size'
        - $ref: '#/components/parameters/wlm.stats_list::query.sort'
        - $ref: '#/components/parameters/wlm.stats_list::query.v'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats_list@200'
        '400':
          $ref: '#/components/responses/wlm.stats_list@400'
  /_wlm/query_group:
    get:
      operationId: wlm.get_query_group.0
      x-operation-group: wlm.get_query_group
      x-version-added: '2.17'
      description: Retrieves the specified query group. If no query group is specified, all query groups in the cluster are retrieved.
      responses:
        '200':
          $ref: '#/components/responses/wlm.get_query_group@200'
    put:
      operationId: wlm.create_query_group.0
      x-operation-group: wlm.create_query_group
      x-version-added: '2.17'
      description: Creates a new query group and sets the resource limits for the new query group.
      requestBody:
        $ref: '#/components/requestBodies/wlm.create_query_group'
      responses:
        '200':
          $ref: '#/components/responses/wlm.create_query_group@200'
  /_wlm/query_group/{name}:
    get:
      operationId: wlm.get_query_group.1
      x-operation-group: wlm.get_query_group
      x-version-added: '2.17'
      description: Retrieves the specified query group. If no query group is specified, all query groups in the cluster are retrieved.
      parameters:
        - $ref: '#/components/parameters/wlm.get_query_group::path.name'
      responses:
        '200':
          $ref: '#/components/responses/wlm.get_query_group@200'
    put:
      operationId: wlm.update_query_group.0
      x-operation-group: wlm.update_query_group
      x-version-added: '2.17'
      description: Updates the specified query group.
      parameters:
        - $ref: '#/components/parameters/wlm.update_query_group::path.name'
      requestBody:
        $ref: '#/components/requestBodies/wlm.update_query_group'
      responses:
        '200':
          $ref: '#/components/responses/wlm.update_query_group@200'
    delete:
      operationId: wlm.delete_query_group.0
      x-operation-group: wlm.delete_query_group
      x-version-added: '2.17'
      description: Deletes the specified query group.
      parameters:
        - $ref: '#/components/parameters/wlm.delete_query_group::path.name'
      responses:
        '200':
          $ref: '#/components/responses/wlm.delete_query_group@200'
  /_wlm/stats:
    get:
      operationId: wlm.stats.0
      x-operation-group: wlm.stats
      x-version-added: '2.18'
      description: Returns workload management statistics for nodes and workload groups.
      parameters:
        - $ref: '#/components/parameters/wlm.stats::query.boolean'
        - $ref: '#/components/parameters/wlm.stats::query.breach'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats@200'
  /_wlm/stats/{workload_group_id}:
    get:
      operationId: wlm.stats.1
      x-operation-group: wlm.stats
      x-version-added: '2.18'
      description: Returns workload management statistics for nodes and workload groups.
      parameters:
        - $ref: '#/components/parameters/wlm.stats::path.workload_group_id'
        - $ref: '#/components/parameters/wlm.stats::query.boolean'
        - $ref: '#/components/parameters/wlm.stats::query.breach'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats@200'
  /_wlm/{node_id}/stats:
    get:
      operationId: wlm.stats.2
      x-operation-group: wlm.stats
      x-version-added: '2.18'
      description: Returns workload management statistics for nodes and workload groups.
      parameters:
        - $ref: '#/components/parameters/wlm.stats::path.node_id'
        - $ref: '#/components/parameters/wlm.stats::query.boolean'
        - $ref: '#/components/parameters/wlm.stats::query.breach'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats@200'
  /_wlm/{node_id}/stats/{workload_group_id}:
    get:
      operationId: wlm.stats.3
      x-operation-group: wlm.stats
      x-version-added: '2.18'
      description: Returns workload management statistics for nodes and workload groups.
      parameters:
        - $ref: '#/components/parameters/wlm.stats::path.node_id'
        - $ref: '#/components/parameters/wlm.stats::path.workload_group_id'
        - $ref: '#/components/parameters/wlm.stats::query.boolean'
        - $ref: '#/components/parameters/wlm.stats::query.breach'
      responses:
        '200':
          $ref: '#/components/responses/wlm.stats@200'
components:
  requestBodies:
    wlm.create_query_group:
      content:
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/QueryGroupCreate'
      required: true
    wlm.update_query_group:
      content:
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/QueryGroupUpdate'
      required: true
  responses:
    wlm.create_query_group@200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/QueryGroupResponse'
    wlm.update_query_group@200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/QueryGroupResponse'
    wlm.delete_query_group@200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              acknowledged:
                type: boolean
    wlm.get_query_group@200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              query_groups:
                type: array
                items:
                  $ref: '../schemas/wlm._common.yaml#/components/schemas/QueryGroupResponse'
    wlm.stats@200:
      description: Workload management statistics grouped by node and workload group.
      content:
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/WlmStatsResponse'
    wlm.stats_list@200:
      description: Paginated workload management statistics in tabular form.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '../schemas/wlm._common.yaml#/components/schemas/WlmStatsListResponse'
    wlm.stats_list@400:
      description: The pagination state or pagination parameters are invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: string
            required:
              - details
              - error
  parameters:
    wlm.update_query_group::path.name:
      name: name
      in: path
      description: The name of the query group.
      schema:
        type: string
      required: true
    wlm.delete_query_group::path.name:
      name: name
      in: path
      description: The name of the query group.
      schema:
        type: string
      required: true
    wlm.get_query_group::path.name:
      name: name
      in: path
      description: The name of the query group.
      schema:
        type: string
      required: true
    wlm.stats::path.node_id:
      name: node_id
      in: path
      description: A node ID or a comma-separated list of node IDs.
      schema:
        type: string
      required: true
    wlm.stats::path.workload_group_id:
      name: workload_group_id
      in: path
      description: A workload group ID or a comma-separated list of workload group IDs.
      schema:
        type: string
      required: true
    wlm.stats::query.boolean:
      name: boolean
      in: query
      description: The breach-state value consumed by the OpenSearch 3.8 implementation when the `breach` parameter is present.
      schema:
        type: boolean
    wlm.stats::query.breach:
      name: breach
      in: query
      description: Filters workload groups by whether a resource limit is breached. In OpenSearch 3.8, the implementation reads the filter value from the `boolean` parameter.
      schema:
        type: boolean
    wlm.stats_list::path.node_id:
      name: node_id
      in: path
      description: A node ID or a comma-separated list of node IDs.
      schema:
        type: string
      required: true
    wlm.stats_list::path.workload_group_id:
      name: workload_group_id
      in: path
      description: A workload group ID or a comma-separated list of workload group IDs.
      schema:
        type: string
      required: true
    wlm.stats_list::query.boolean:
      name: boolean
      in: query
      description: The breach-state value consumed by the OpenSearch 3.8 implementation when the `breach` parameter is present.
      schema:
        type: boolean
    wlm.stats_list::query.breach:
      name: breach
      in: query
      description: Filters workload groups by whether a resource limit is breached. In OpenSearch 3.8, the implementation reads the filter value from the `boolean` parameter.
      schema:
        type: boolean
    wlm.stats_list::query.next_token:
      name: next_token
      in: query
      description: The token used to retrieve the next page of results.
      schema:
        type: string
    wlm.stats_list::query.order:
      name: order
      in: query
      description: The sort order.
      schema:
        $ref: '../schemas/wlm._common.yaml#/components/schemas/WlmStatsSortOrder'
        default: asc
    wlm.stats_list::query.size:
      name: size
      in: query
      description: The number of results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    wlm.stats_list::query.sort:
      name: sort
      in: query
      description: The field used to sort results.
      schema:
        $ref: '../schemas/wlm._common.yaml#/components/schemas/WlmStatsSortBy'
        default: node_id
    wlm.stats_list::query.v:
      name: v
      in: query
      description: Whether to include column headers in the text response.
      schema:
        type: boolean
        default: false
