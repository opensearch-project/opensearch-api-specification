openapi: 3.1.0
info:
  title: OpenSearch Remote Store API
  description: OpenSearch Remote Store API.
  version: 1.0.0
paths:
  /_remotestore/_restore:
    post:
      operationId: remote_store.restore.0
      x-operation-group: remote_store.restore
      x-version-added: '1.0'
      description: Restores from remote store.
      externalDocs:
        url: https://docs.opensearch.org/latest/tuning-your-cluster/availability-and-recovery/remote-store/index/#restoring-from-a-backup
      parameters:
        - $ref: '#/components/parameters/remote_store.restore::query.cluster_manager_timeout'
        - $ref: '#/components/parameters/remote_store.restore::query.wait_for_completion'
      requestBody:
        $ref: '#/components/requestBodies/remote_store.restore'
      responses:
        '200':
          $ref: '#/components/responses/remote_store.restore@200'
  /_remotestore/metadata/{index}:
    get:
      operationId: remote_store.metadata.0
      x-operation-group: remote_store.metadata
      x-version-added: '3.2'
      description: Returns remote segment and translog metadata for an index or shard.
      parameters:
        - $ref: '#/components/parameters/remote_store.metadata::path.index'
      responses:
        '200':
          $ref: '#/components/responses/remote_store.metadata@200'
  /_remotestore/metadata/{index}/{shard_id}:
    get:
      operationId: remote_store.metadata.1
      x-operation-group: remote_store.metadata
      x-version-added: '3.2'
      description: Returns remote segment and translog metadata for an index or shard.
      parameters:
        - $ref: '#/components/parameters/remote_store.metadata::path.index'
        - $ref: '#/components/parameters/remote_store.metadata::path.shard_id'
      responses:
        '200':
          $ref: '#/components/responses/remote_store.metadata@200'
  /_remotestore/stats/{index}:
    get:
      operationId: remote_store.stats.0
      x-operation-group: remote_store.stats
      x-version-added: '2.8'
      description: Returns remote store statistics for an index or shard.
      parameters:
        - $ref: '#/components/parameters/remote_store.stats::path.index'
        - $ref: '#/components/parameters/remote_store.stats::query.local'
      responses:
        '200':
          $ref: '#/components/responses/remote_store.stats@200'
  /_remotestore/stats/{index}/{shard_id}:
    get:
      operationId: remote_store.stats.1
      x-operation-group: remote_store.stats
      x-version-added: '2.8'
      description: Returns remote store statistics for an index or shard.
      parameters:
        - $ref: '#/components/parameters/remote_store.stats::path.index'
        - $ref: '#/components/parameters/remote_store.stats::path.shard_id'
        - $ref: '#/components/parameters/remote_store.stats::query.local'
      responses:
        '200':
          $ref: '#/components/responses/remote_store.stats@200'
components:
  requestBodies:
    remote_store.restore:
      content:
        application/json:
          schema:
            type: object
            description: Comma-separated list of index IDs
            properties:
              indices:
                type: array
                items:
                  type: string
            required:
              - indices
          examples:
            RemoteStoreRestore_example1:
              summary: Examples for Post Remote Storage Restore Operation.
              value:
                indices:
                  - books
      required: true
  responses:
    remote_store.metadata@200:
      description: Remote segment and translog metadata grouped by index and shard.
      content:
        application/json:
          schema:
            $ref: '../schemas/remote_store._common.yaml#/components/schemas/RemoteStoreMetadataResponse'
    remote_store.restore@200:
      content:
        application/json:
          schema:
            type: object
            properties:
              accepted:
                type: boolean
              remote_store:
                $ref: '../schemas/remote_store._common.yaml#/components/schemas/RemoteStoreRestoreInfo'
          examples:
            RemoteStoreRestore_example1:
              summary: Examples for Post Remote Storage Restore Operation.
              value:
                remote_store:
                  indices:
                    - books
                  shards:
                    total: 1
                    failed: 0
                    successful: 1
    remote_store.stats@200:
      description: Remote segment and translog transfer statistics grouped by index and shard.
      content:
        application/json:
          schema:
            $ref: '../schemas/remote_store._common.yaml#/components/schemas/RemoteStoreStatsResponse'
  parameters:
    remote_store.metadata::path.index:
      in: path
      name: index
      description: The index for which to return remote store metadata.
      required: true
      schema:
        type: string
      style: simple
    remote_store.metadata::path.shard_id:
      in: path
      name: shard_id
      description: The shard ID for which to return remote store metadata.
      required: true
      schema:
        type: string
      style: simple
    remote_store.restore::query.cluster_manager_timeout:
      name: cluster_manager_timeout
      in: query
      description: Operation timeout for connection to cluster-manager node.
      schema:
        $ref: '../schemas/_common.yaml#/components/schemas/Duration'
      x-version-added: '2.0'
    remote_store.restore::query.wait_for_completion:
      name: wait_for_completion
      in: query
      description: Should this request wait until the operation has completed before returning.
      schema:
        type: boolean
        default: false
        description: Should this request wait until the operation has completed before returning.
    remote_store.stats::path.index:
      in: path
      name: index
      description: The index for which to return remote store statistics.
      required: true
      schema:
        type: string
      style: simple
    remote_store.stats::path.shard_id:
      in: path
      name: shard_id
      description: The shard ID for which to return remote store statistics.
      required: true
      schema:
        type: string
      style: simple
    remote_store.stats::query.local:
      in: query
      name: local
      description: Whether to return statistics only from the local node.
      schema:
        type: boolean
        default: false
      style: form
