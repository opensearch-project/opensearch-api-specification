openapi: 3.1.0
info:
  title: Schemas of ism._common Category
  description: This document defines schemas for the `ism._common` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    Metadata:
      type: object
      properties:
        _id:
          $ref: '_common.yaml#/components/schemas/Id'
        _primary_term:
          type: integer
          format: int64
          description: The primary term of the document.
        _seq_no:
          $ref: '_common.yaml#/components/schemas/SequenceNumber'
        _version:
          $ref: '_common.yaml#/components/schemas/VersionNumber'
    Policy:
      type: object
      description: The policy defines how an index is managed throughout its lifetime.
      properties:
        policy_id:
          type: string
          description: The unique identifier for the policy.
        description:
          type: string
          description: The description of the policy.
        last_updated_time:
          type: integer
          description: When the policy was last updated.
        schema_version:
          type: integer
          format: int64
          description: The version of the policy schema.
        error_notification:
          oneOf:
            - $ref: '#/components/schemas/ErrorNotification'
            - type: 'null'
          description: The configuration for error notifications.
        default_state:
          type: string
          description: The default state an index is in.
        states:
          type: array
          description: The list of states for the index to transition between.
          items:
            $ref: '#/components/schemas/States'
        ism_template:
          oneOf:
            - $ref: '#/components/schemas/IsmTemplate'
            - type: 'null'
            - type: array
              items:
                $ref: '#/components/schemas/IsmTemplate'
          description: The ISM template configuration.
      required:
        - default_state
        - description
        - states
    PolicyWithMetadata:
      type: object
      allOf:
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/PolicyEnvelope'
    States:
      type: object
      description: The list of actions to perform and transitions to enter a new state.
      properties:
        name:
          type: string
          description: The name of the state.
        actions:
          type: array
          description: The list of actions to perform.
          items:
            $ref: '#/components/schemas/Action'
        transitions:
          type: array
          description: The list of transitions to enter a new state.
          items:
            $ref: '#/components/schemas/Transition'
      required:
        - name
    Action:
      type: object
      description: An action to perform.
      properties:
        timeout:
          $ref: '_common.yaml#/components/schemas/Duration'
          description: The amount of time to wait before the action fails.
        retry:
          $ref: '#/components/schemas/ActionRetry'
          description: The number of times to retry the action.
        alias:
          $ref: '#/components/schemas/ActionAlias'
          description: Adds or removes an index alias.
        delete:
          $ref: '#/components/schemas/ActionDelete'
          description: Deletes an index.
        force_merge:
          $ref: '#/components/schemas/ActionForceMerge'
          description: Force merges an index.
        read_only:
          $ref: '#/components/schemas/ActionReadOnly'
          description: Changes the index permissions to read-only.
        read_write:
          $ref: '#/components/schemas/ActionReadWrite'
          description: Changes the index permissions to read-write.
        replica_count:
          $ref: '#/components/schemas/ActionReplicaCount'
          description: The number of replicas for the index.
        index_priority:
          $ref: '#/components/schemas/ActionIndexPriority'
          description: The priority level of the index.
        close:
          $ref: '#/components/schemas/ActionClose'
          description: Closes an index.
        open:
          $ref: '#/components/schemas/ActionOpen'
          description: Opens an index.
        snapshot:
          $ref: '#/components/schemas/ActionSnapshot'
          description: Takes a snapshot of the index.
        rollover:
          $ref: '#/components/schemas/ActionRollover'
          description: Sets a rollover policy for the index.
        notification:
          $ref: '#/components/schemas/ActionNotification'
          description: Sets a policy which determines when to send a notification regarding the index.
        allocation:
          $ref: '#/components/schemas/ActionAllocation'
          description: Sets the allocations settings for index.
        rollup:
          $ref: '#/components/schemas/ActionRollup'
          description: Determines when to perform an index rollup.
        transform:
          $ref: '#/components/schemas/ActionTransform'
          description: Determines when to perform an index transform.
          x-version-added: '2.12'
        shrink:
          $ref: '#/components/schemas/ActionShrink'
          description: Determines when to shrink the index.
          x-version-added: '2.0'
        convert_index_to_remote:
          $ref: '#/components/schemas/ActionConvertIndexToRemote'
          description: Restores the index from a snapshot as a remote snapshot index.
          x-version-added: '3.0'
        stop_replication:
          $ref: '#/components/schemas/ActionStopReplication'
          description: Stops cross-cluster replication on a follower index.
          x-version-added: '3.0'
        search_only:
          $ref: '#/components/schemas/ActionSearchOnly'
          description: Scales the index to search-only mode.
          x-version-added: '3.5'
        publish_field_domains:
          $ref: '#/components/schemas/ActionPublishFieldDomains'
          description: Computes and publishes the value domains of index fields.
          x-version-added: '3.9'
        custom:
          $ref: '#/components/schemas/ActionCustom'
          description: Enables custom operations to be performed on the index.
    ActionRetry:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The number of retry attempts.
        backoff:
          $ref: '#/components/schemas/ActionRetryBackoff'
        delay:
          $ref: '_common.yaml#/components/schemas/Duration'
          description: The delay between retry attempts.
      required:
        - count
    ActionRetryBackoff:
      type: string
      description: The backoff strategy for retries.
      enum:
        - constant
        - exponential
        - linear
    ActionAlias:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: 'indices.update_aliases.yaml#/components/schemas/Action'
          description: The alias actions to perform.
    ActionDelete:
      type: object
      description: The delete action configuration.
    ActionForceMerge:
      type: object
      properties:
        max_num_segments:
          type: integer
          description: The maximum number of segments to merge to.
      required:
        - max_num_segments
    ActionReadOnly:
      type: object
      description: The read-only action configuration.
    ActionReadWrite:
      type: object
      description: The read-write action configuration.
    ActionReplicaCount:
      type: object
      properties:
        number_of_replicas:
          type: integer
          description: The number of replicas to set.
      required:
        - number_of_replicas
    ActionIndexPriority:
      type: object
      properties:
        priority:
          type: integer
          description: The priority to set for the index.
      required:
        - priority
    ActionClose:
      type: object
      description: The close action configuration.
    ActionOpen:
      type: object
      description: The open action configuration.
    ActionSnapshot:
      type: object
      properties:
        repository:
          type: string
          description: The repository to store the snapshot.
        snapshot:
          type: string
          description: The name of the snapshot.
      required:
        - repository
        - snapshot
    ActionRollover:
      type: object
      properties:
        min_size:
          type: string
          description: The minimum size to trigger rollover.
        min_index_age:
          type: string
          description: The minimum index age to trigger rollover.
        min_doc_count:
          type: integer
          format: int64
          description: The minimum document count to trigger rollover.
        min_primary_shard_size:
          type: string
          description: The minimum primary shard size to trigger rollover.
        copy_alias:
          type: boolean
          description: Whether to copy the alias to the new index.
    ActionNotification:
      type: object
      description: The notification action configuration. Requires exactly one of `destination` or `channel`.
      properties:
        destination:
          $ref: '#/components/schemas/ErrorNotificationDestination'
        channel:
          $ref: '#/components/schemas/Channel'
        message_template:
          $ref: '_common.yaml#/components/schemas/Script'
      required:
        - message_template
    ActionAllocation:
      type: object
      properties:
        require:
          type: object
          additionalProperties: true
          description: The required allocation attributes.
        include:
          type: object
          additionalProperties: true
          description: The included allocation attributes.
        exclude:
          type: object
          additionalProperties: true
          description: The excluded allocation attributes.
        wait_for:
          type: boolean
          description: Whether to wait for the allocation to complete.
    ActionRollup:
      type: object
      description: The rollup action configuration.
      properties:
        ism_rollup:
          type: object
          additionalProperties: true
          description: The rollup job to run on the index.
      required:
        - ism_rollup
    ActionTransform:
      type: object
      description: The transform action configuration.
      properties:
        ism_transform:
          type: object
          additionalProperties: true
          description: The transform job to run on the index.
      required:
        - ism_transform
    ActionShrink:
      type: object
      description: The shrink action configuration. Requires exactly one of `num_new_shards`, `max_shard_size` or `percentage_of_source_shards`.
      properties:
        num_new_shards:
          type: integer
          description: The number of primary shards of the shrunken index.
        max_shard_size:
          $ref: '_common.yaml#/components/schemas/HumanReadableByteCount'
        percentage_of_source_shards:
          type: number
          format: double
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: The number of primary shards of the shrunken index as a fraction of the source shards.
        target_index_name_template:
          $ref: '_common.yaml#/components/schemas/Script'
        aliases:
          type: array
          description: The aliases to add to the shrunken index.
          items:
            type: object
            additionalProperties:
              $ref: 'indices._common.yaml#/components/schemas/Alias'
            minProperties: 1
            maxProperties: 1
        switch_aliases:
          type: boolean
          description: Whether to move the aliases of the source index to the shrunken index.
          x-version-added: '2.12'
        force_unsafe:
          type: boolean
          description: Whether to shrink the index even if it has no replicas.
    ActionConvertIndexToRemote:
      type: object
      description: The convert index to remote action configuration.
      properties:
        repository:
          type: string
          description: The repository that holds the snapshot.
        snapshot:
          type: string
          description: The name of the snapshot to restore.
        include_aliases:
          type: boolean
          default: false
          description: Whether to restore the aliases of the index.
        ignore_index_settings:
          type: string
          default: ''
          description: Comma-separated list of index settings to ignore when restoring.
        number_of_replicas:
          type: integer
          description: The number of replicas of the restored index.
        delete_original_index:
          type: boolean
          default: false
          description: Whether to delete the original index after the restore.
        rename_pattern:
          type: string
          default: $1_remote
          description: The pattern for the name of the restored index.
      required:
        - repository
        - snapshot
    ActionStopReplication:
      type: object
      description: The stop replication action configuration.
    ActionSearchOnly:
      type: object
      description: The search-only action configuration.
    ActionPublishFieldDomains:
      type: object
      description: The publish field domains action configuration.
      properties:
        fields:
          type: array
          minItems: 1
          description: The fields to compute the value domains for.
          items:
            $ref: '#/components/schemas/FieldDomain'
      required:
        - fields
    FieldDomain:
      type: object
      properties:
        field:
          type: string
          description: The name of the field.
        type:
          type: string
          description: The type of the field domain calculator.
      required:
        - field
        - type
    ActionCustom:
      type: object
      additionalProperties: true
      description: The custom action configuration.
    Transition:
      type: object
      description: A transition into a new state.
      properties:
        state_name:
          type: string
          description: The name of the state to transition to.
        conditions:
          $ref: '#/components/schemas/TransitionConditions'
      required:
        - state_name
    TransitionConditions:
      type: object
      description: The condition for the transition. Accepts at most one condition.
      properties:
        min_index_age:
          $ref: '_common.yaml#/components/schemas/Duration'
        min_doc_count:
          type: integer
          format: int64
          minimum: 1
          description: The minimum document count of the index.
        min_size:
          $ref: '_common.yaml#/components/schemas/HumanReadableByteCount'
        cron:
          $ref: '#/components/schemas/TransitionCron'
        min_rollover_age:
          $ref: '_common.yaml#/components/schemas/Duration'
          x-version-added: '1.3'
        no_alias:
          type: boolean
          description: If `true`, the index must have no aliases. If `false`, the index must have at least one alias.
          x-version-added: '3.2'
        min_state_age:
          $ref: '_common.yaml#/components/schemas/Duration'
          x-version-added: '3.2'
      maxProperties: 1
    TransitionCron:
      type: object
      properties:
        cron:
          $ref: 'rollups._common.yaml#/components/schemas/Cron'
      required:
        - cron
    GetPoliciesResponse:
      type: object
      properties:
        total_policies:
          type: integer
          description: The total number of policies.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyWithMetadata'
          description: The list of policies.
    GetPolicyResponse:
      $ref: '#/components/schemas/PolicyWithMetadata'
    PutPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/Metadata'
        - type: object
          properties:
            policy:
              $ref: '#/components/schemas/PolicyEnvelope'
    DeletePolicyResponse:
      $ref: '_common.yaml#/components/schemas/WriteResponseBase'
    ChangeResponse:
      type: object
      properties:
        updated_indices:
          type: integer
          description: The number of updated indices.
        failures:
          type: boolean
          description: Whether there were any failures.
        failed_indices:
          type: array
          items:
            $ref: '#/components/schemas/FailedIndex'
          description: The list of indices that failed to update.
    ChangePolicyResponse:
      $ref: '#/components/schemas/ChangeResponse'
    FailedIndex:
      type: object
      properties:
        index_name:
          type: string
          description: The name of the failed index.
        index_uuid:
          type: string
          description: The UUID of the failed index.
        reason:
          type: string
          description: The reason for the failure.
    RemovePolicyResponse:
      $ref: '#/components/schemas/ChangePolicyResponse'
    AddPolicyResponse:
      $ref: '#/components/schemas/ChangePolicyResponse'
    PolicyEnvelope:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
    PutPolicyRequest:
      $ref: '#/components/schemas/PolicyEnvelope'
    AddPolicyRequest:
      type: object
      properties:
        policy_id:
          type: string
          description: The ID of the policy to add.
      required:
        - policy_id
    ChangePolicyRequest:
      type: object
      properties:
        policy_id:
          type: string
          description: The ID of the new policy.
        state:
          type: string
          description: The state to transition to.
        include:
          type: array
          items:
            $ref: '#/components/schemas/IncludeState'
          description: The states to include in the policy change.
      required:
        - policy_id
    IncludeState:
      type: object
      properties:
        state:
          type: string
          description: The name of the state to include.
      required:
        - state
    ExplainIndexResponse:
      type: object
      properties:
        total_managed_indices:
          type: integer
          description: The total number of managed indices.
      additionalProperties:
        $ref: '#/components/schemas/ExplainPolicy'
    ExplainPolicy:
      type: object
      properties:
        index.plugins.index_state_management.policy_id:
          type: ['null', string]
          description: The ID of the policy applied to the index.
        index.opendistro.index_state_management.policy_id:
          type: ['null', string]
          description: The ID of the OpenDistro policy applied to the index.
        enabled:
          type: [boolean, 'null']
          description: Whether the policy is enabled for the index.
    ErrorNotification:
      type: object
      description: The error notification configuration. Requires exactly one of `destination` or `channel`.
      properties:
        destination:
          $ref: '#/components/schemas/ErrorNotificationDestination'
        channel:
          $ref: '#/components/schemas/Channel'
        message_template:
          $ref: '_common.yaml#/components/schemas/Script'
      required:
        - message_template
    Channel:
      type: object
      properties:
        id:
          type: string
          description: The ID of the notification channel.
      required:
        - id
    ErrorNotificationDestination:
      type: object
      description: The notification destination. Requires exactly one of `chime`, `slack` or `custom_webhook`.
      properties:
        chime:
          $ref: '#/components/schemas/ErrorNotificationChime'
        slack:
          $ref: '#/components/schemas/ErrorNotificationSlack'
        custom_webhook:
          $ref: '#/components/schemas/ErrorNotificationCustomWebhook'
      minProperties: 1
      maxProperties: 1
    ErrorNotificationChime:
      type: object
      properties:
        url:
          type: string
          description: The URL for the Chime webhook.
      required:
        - url
    ErrorNotificationSlack:
      type: object
      properties:
        url:
          type: string
          description: The URL for the Slack webhook.
      required:
        - url
    ErrorNotificationCustomWebhook:
      type: object
      description: The custom webhook. Requires `url` or `host`.
      properties:
        url:
          type: ['null', string]
          description: The URL for the custom webhook.
        scheme:
          type: ['null', string]
          description: The scheme for the custom webhook.
        host:
          type: ['null', string]
          description: The host for the custom webhook.
        port:
          type: integer
          description: The port for the custom webhook.
        path:
          type: ['null', string]
          description: The path for the custom webhook.
        query_params:
          type: object
          additionalProperties:
            type: string
          description: The query parameters for the custom webhook.
        header_params:
          type: object
          additionalProperties:
            type: string
          description: The header parameters for the custom webhook.
        username:
          type: ['null', string]
          description: The username for the custom webhook.
        password:
          type: ['null', string]
          description: The password for the custom webhook.
    IsmTemplate:
      type: object
      properties:
        index_patterns:
          type: array
          items:
            type: string
          description: The index patterns for the ISM template.
        priority:
          type: integer
          description: The priority of the ISM template.
        last_updated_time:
          type: integer
          description: When the ISM template was last updated.
    RetryIndexRequest:
      type: object
      properties:
        state:
          type: string
          description: The state to retry.
      required:
        - state
    RetryIndexResponse:
      $ref: '#/components/schemas/ChangeResponse'
    RefreshSearchAnalyzersResponse:
      type: object
      properties:
        _shards:
          $ref: '_common.yaml#/components/schemas/ShardStatistics'
        successful_refresh_details:
          type: array
          items:
            $ref: '#/components/schemas/RefreshSearchAnalyzersResponseDetails'
          description: The details of successful analyzer refreshes.
    RefreshSearchAnalyzersResponseDetails:
      type: object
      properties:
        index:
          type: string
          description: The name of the index.
        refreshed_analyzers:
          type: array
          items:
            type: string
          description: The list of refreshed analyzers.