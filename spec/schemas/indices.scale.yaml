openapi: 3.1.0
info:
  title: OpenSearch Scale Index API
  description: OpenSearch Scale Index API schemas.
  version: 1.0.0
paths: {}
components:
  schemas:
    ScaleIndexRequest:
      type: object
      additionalProperties: false
      properties:
        search_only:
          type: boolean
          description: Whether to scale the index to search-only mode. Set to `false` to return the index to normal read-write operation.
      required:
        - search_only
    ScaleIndexResponse:
      type: object
      properties:
        failure_reason:
          type: string
          description: Details about shards that prevented the scale operation from completing. This property is omitted when the operation succeeds.
