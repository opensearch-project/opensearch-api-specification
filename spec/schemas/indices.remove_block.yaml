openapi: 3.1.0
info:
  title: Schemas of `indices.remove_block` Category
  description: Schemas of `indices.remove_block` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    IndicesUnblockStatus:
      description: The status of a remove block operation on an index.
      type: object
      properties:
        name:
          $ref: '_common.yaml#/components/schemas/IndexName'
        unblocked:
          description: |-
            Whether the index no longer has the block.
            This is `true` also if the index did not have the block.
          type: boolean
        exception:
          description: Why the block could not be removed. Only present if `unblocked` is `false`.
          $ref: '#/components/schemas/IndicesUnblockException'
      required:
        - name
        - unblocked
    IndicesUnblockException:
      type: object
      properties:
        error:
          $ref: '_common.yaml#/components/schemas/ErrorCause'
      required:
        - error
