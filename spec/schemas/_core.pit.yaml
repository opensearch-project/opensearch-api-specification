openapi: 3.1.0
info:
  title: Schemas of `_core.pit` Category
  description: Schemas of `_core.pit` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    DeletedPit:
      type: object
      properties:
        pit_id:
          $ref: '_common.yaml#/components/schemas/PitId'
        successful:
          type: boolean
      required:
        - pit_id
        - successful
    PitDetail:
      type: object
      properties:
        pit_id:
          $ref: '_common.yaml#/components/schemas/PitId'
        creation_time:
          type: integer
          format: int64
        keep_alive:
          type: integer
          format: int64
      required:
        - pit_id
