openapi: 3.1.0
info:
  title: Schemas of `indices.list_tier_status` Category.
  description: Schemas of `indices.list_tier_status` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    TieringTargetTierFilter:
      type: string
      description: The tier to filter tiering operations by, matching the operations that move indexes to it.
      enum:
        - _hot
        - _warm
    TieringStatusRecord:
      type: object
      properties:
        index:
          $ref: '_common.yaml#/components/schemas/IndexName'
        state:
          $ref: 'indices._common.yaml#/components/schemas/TieringState'
        source:
          description: The tier the index is moving from.
          $ref: 'indices._common.yaml#/components/schemas/TieringTier'
        target:
          description: The tier the index is moving to.
          $ref: 'indices._common.yaml#/components/schemas/TieringTier'
