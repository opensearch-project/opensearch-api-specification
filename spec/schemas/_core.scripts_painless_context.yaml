openapi: 3.1.0
info:
  title: OpenSearch Painless Context API
  description: OpenSearch Painless Context API schemas.
  version: 1.0.0
paths: {}
components:
  schemas:
    PainlessContextResponse:
      type: object
      properties:
        contexts:
          type: array
          description: The available Painless contexts.
          items:
            type: string
        name:
          type: string
          description: The selected Painless context.
        classes:
          type: array
          description: The classes available to the selected context.
          items:
            type: object
            additionalProperties: true
        imported_methods:
          type: array
          description: The methods imported into the selected context.
          items:
            type: object
            additionalProperties: true
        class_bindings:
          type: array
          description: The class bindings available to the selected context.
          items:
            type: object
            additionalProperties: true
        instance_bindings:
          type: array
          description: The instance bindings available to the selected context.
          items:
            type: object
            additionalProperties: true
