openapi: 3.1.0
info:
  title: Schemas of `cluster._common` Category
  description: Schemas of `cluster._common` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    WaitForNodes:
      description: Waits until the specified number of nodes (`N`) is available. Accepts `>=N`, `<=N`, `>N`, and `<N`. You can also use `ge(N)`, `le(N)`, `gt(N)`, and `lt(N)` notation.
      oneOf:
        - title: count
          type: integer
          format: int32
        - title: comparison
          type: string
    ComponentTemplate:
      type: object
      properties:
        name:
          $ref: '_common.yaml#/components/schemas/Name'
        component_template:
          $ref: '#/components/schemas/ComponentTemplateNode'
      required:
        - component_template
        - name
    ComponentTemplateNode:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/ComponentTemplateSummary'
        version:
          $ref: '_common.yaml#/components/schemas/VersionNumber'
        _meta:
          $ref: '_common.yaml#/components/schemas/Metadata'
      required:
        - template
    ComponentTemplateSummary:
      type: object
      properties:
        _meta:
          $ref: '_common.yaml#/components/schemas/Metadata'
        version:
          $ref: '_common.yaml#/components/schemas/VersionNumber'
        settings:
          type: object
          additionalProperties:
            $ref: 'indices._common.yaml#/components/schemas/IndexSettings'
        mappings:
          $ref: '_common.mapping.yaml#/components/schemas/TypeMapping'
        aliases:
          type: object
          additionalProperties:
            $ref: 'indices._common.yaml#/components/schemas/AliasDefinition'
    SettingMetadata:
      type: object
      properties:
        dynamic:
          type: boolean
          description: Whether the setting is dynamic. A dynamic setting can be updated on a running cluster; a static setting requires a node restart to change.
        default:
          type: string
          description: The default value declared in the setting definition, in the string form that the Cluster Settings API accepts. Omitted for secure (keystore) settings and for settings that declare an empty default. Some defaults are computed by the node that responds to the request.
        validation:
          $ref: '#/components/schemas/SettingValidation'
        description:
          type: string
          description: The description declared in the setting definition. Omitted when the definition does not include a description.
      required:
        - dynamic
    SettingValidation:
      type: object
      description: The declared value type and bounds of a setting. Present only for settings defined with a typed parser; string, list, and enumerated settings have no validation object.
      properties:
        type:
          $ref: '#/components/schemas/SettingValueType'
        min:
          type: string
          description: The smallest accepted value, in the same string form as `default`. Omitted when the definition places no lower bound on the value.
        max:
          type: string
          description: The largest accepted value, in the same string form as `default`. Omitted when the definition places no upper bound on the value.
      required:
        - type
    SettingValueType:
      type: string
      description: The value type of a setting.
      enum:
        - boolean
        - byte_size
        - double
        - float
        - integer
        - long
        - memory_size
        - time
