openapi: 3.1.0
info:
  title: Schemas of `search_pipeline._common` Category
  description: Schemas of `search_pipeline._common` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    SearchPipelineMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SearchPipelineStructure'
    SearchPipelineStructure:
      type: object
      properties:
        description:
          type: string
        version:
          type: integer
          format: int32
        request_processors:
          type: array
          items:
            $ref: '#/components/schemas/RequestProcessor'
        response_processors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseProcessor'
        phase_results_processors:
          type: array
          items:
            $ref: '#/components/schemas/PhaseResultsProcessor'
    RequestProcessor:
      oneOf:
        - x-version-added: '3.2'
          type: object
          title: agentic_query_translator
          properties:
            agentic_query_translator:
              $ref: '#/components/schemas/AgenticQueryTranslatorRequestProcessor'
          required:
            - agentic_query_translator
        - type: object
          title: filter_query
          properties:
            filter_query:
              $ref: '#/components/schemas/FilterQueryRequestProcessor'
          required:
            - filter_query
        - x-version-added: '2.16'
          type: object
          title: ml_inference
          properties:
            ml_inference:
              $ref: '#/components/schemas/MLInferenceSearchRequestProcessor'
          required:
            - ml_inference
        - type: object
          title: neural_query_enricher
          properties:
            neural_query_enricher:
              $ref: '#/components/schemas/NeuralQueryEnricherRequestProcessor'
          required:
            - neural_query_enricher
        - x-version-added: '2.15'
          type: object
          title: neural_sparse_two_phase_processor
          properties:
            neural_sparse_two_phase_processor:
              $ref: '#/components/schemas/NeuralSparseTwoPhaseRequestProcessor'
          required:
            - neural_sparse_two_phase_processor
        - type: object
          title: script
          properties:
            script:
              $ref: '#/components/schemas/SearchScriptRequestProcessor'
          required:
            - script
        - type: object
          title: oversample
          properties:
            oversample:
              $ref: '#/components/schemas/OversampleRequestProcessor'
          required:
            - oversample
    AgenticQueryTranslatorRequestProcessor:
      x-version-added: '3.2'
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        agent_id:
          description: The ID of the agent to use for query translation.
          type: string
      required:
        - agent_id
    FilterQueryRequestProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        query:
          $ref: '_common.query_dsl.yaml#/components/schemas/QueryContainer'
    NeuralQueryEnricherRequestProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        default_model_id:
          type: string
        neural_field_default_id:
          $ref: '#/components/schemas/NeuralFieldMap'
    NeuralFieldMap:
      type: object
      additionalProperties:
        type: string
    SearchScriptRequestProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        source:
          type: string
        lang:
          type: string
      required:
        - source
    OversampleRequestProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        sample_factor:
          type: number
          format: float
        content_prefix:
          type: string
      required:
        - sample_factor
    ResponseProcessor:
      oneOf:
        - x-version-added: '3.3'
          type: object
          title: agentic_context
          properties:
            agentic_context:
              $ref: '#/components/schemas/AgenticContextResponseProcessor'
          required:
            - agentic_context
        - type: object
          title: personalize_search_ranking
          properties:
            personalize_search_ranking:
              $ref: '#/components/schemas/PersonalizeSearchRankingResponseProcessor'
          required:
            - personalize_search_ranking
        - type: object
          title: retrieval_augmented_generation
          properties:
            retrieval_augmented_generation:
              $ref: '#/components/schemas/RetrievalAugmentedGenerationResponseProcessor'
          required:
            - retrieval_augmented_generation
        - type: object
          title: rename_field
          properties:
            rename_field:
              $ref: '#/components/schemas/RenameFieldResponseProcessor'
          required:
            - rename_field
        - type: object
          title: rerank
          properties:
            rerank:
              $ref: '#/components/schemas/RerankResponseProcessor'
          required:
            - rerank
        - type: object
          title: collapse
          properties:
            collapse:
              $ref: '#/components/schemas/CollapseResponseProcessor'
          required:
            - collapse
        - x-version-added: '2.19'
          type: object
          title: hybrid_score_explanation
          properties:
            hybrid_score_explanation:
              $ref: '#/components/schemas/HybridScoreExplanationResponseProcessor'
          required:
            - hybrid_score_explanation
        - x-version-added: '2.16'
          type: object
          title: ml_inference
          properties:
            ml_inference:
              $ref: '#/components/schemas/MLInferenceSearchResponseProcessor'
          required:
            - ml_inference
        - type: object
          title: truncate_hits
          properties:
            truncate_hits:
              $ref: '#/components/schemas/TruncateHitsResponseProcessor'
          required:
            - truncate_hits
        - type: object
          title: sort
          properties:
            sort:
              $ref: '#/components/schemas/SortResponseProcessor'
          required:
            - sort
        - type: object
          title: split
          properties:
            split:
              $ref: '#/components/schemas/SplitResponseProcessor'
          required:
            - split
    AgenticContextResponseProcessor:
      x-version-added: '3.3'
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        agent_steps_summary:
          description: Whether to include the agent's execution step summary in the response. Available for conversational agents only.
          type: boolean
          default: false
        dsl_query:
          description: Whether to include the generated DSL query in the response. Available for both conversational and flow agents.
          type: boolean
          default: false
    PersonalizeSearchRankingResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        campaign_arn:
          type: string
        recipe:
          type: string
        weight:
          type: number
          format: float
        item_id_field:
          type: string
        iam_role_arn:
          type: string
      required:
        - campaign_arn
        - recipe
        - weight
    RetrievalAugmentedGenerationResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        model_id:
          type: string
        context_field_list:
          type: array
          items:
            type: string
        system_prompt:
          type: string
        user_instructions:
          type: string
      required:
        - context_field_list
        - model_id
    RenameFieldResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        field:
          type: string
        target_field:
          type: string
      required:
        - field
        - target_field
    RerankContext:
      type: object
      properties:
        document_fields:
          type: array
          items:
            type: string
      required:
        - document_fields
    MLOpenSearchReranker:
      type: object
      properties:
        model_id:
          type: string
      required:
        - model_id
    RerankResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        ml_opensearch:
          $ref: '#/components/schemas/MLOpenSearchReranker'
        context:
          $ref: '#/components/schemas/RerankContext'
    CollapseResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        field:
          type: string
        context_prefix:
          type: string
      required:
        - field
    TruncateHitsResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        target_size:
          type: integer
          format: int32
        context_prefix:
          type: string
    SortResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        field:
          type: string
        order:
          type: string
        target_field:
          type: string
      required:
        - field
    SplitResponseProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        field:
          type: string
        separator:
          type: string
        preserve_trailing:
          type: boolean
        target_field:
          type: string
      required:
        - field
        - separator
    PhaseResultsProcessor:
      oneOf:
        - type: object
          title: normalization-processor
          properties:
            normalization-processor:
              $ref: '#/components/schemas/NormalizationPhaseResultsProcessor'
          required:
            - normalization-processor
        - type: object
          title: score-ranker-processor
          properties:
            score-ranker-processor:
              $ref: '#/components/schemas/ScoreRankerPhaseResultsProcessor'
          required:
            - score-ranker-processor
    NormalizationPhaseResultsProcessor:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        normalization:
          $ref: '#/components/schemas/ScoreNormalization'
        combination:
          $ref: '#/components/schemas/ScoreCombination'
    ScoreNormalization:
      type: object
      properties:
        technique:
          $ref: '#/components/schemas/ScoreNormalizationTechnique'
    ScoreNormalizationTechnique:
      type: string
      enum:
        - l2
        - min_max
    ScoreCombination:
      type: object
      properties:
        technique:
          $ref: '#/components/schemas/ScoreCombinationTechnique'
        parameters:
          $ref: '#/components/schemas/ScoreCombinationParameters'
    ScoreCombinationParameters:
      type: object
      properties:
        weights:
          type: array
          items:
            type: number
            format: float
    ScoreCombinationTechnique:
      type: string
      enum:
        - arithmetic_mean
        - geometric_mean
        - harmonic_mean
    ScoreRankerPhaseResultsProcessor:
      type: object
      properties:
        combination:
          $ref: '#/components/schemas/ScoreRankerCombination'
      required:
        - combination
    ScoreRankerCombination:
      type: object
      properties:
        technique:
          $ref: '#/components/schemas/ScoreRankerCombinationTechnique'
        rank_constant:
          type: integer
          format: int32
          minimum: 1
      required:
        - technique
    ScoreRankerCombinationTechnique:
      type: string
      enum:
        - rrf
    MLInferenceFieldMap:
      type: object
      additionalProperties:
        type: string
    MLInferenceProcessorBase:
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        model_id:
          description: The ID of the ML model used by the processor.
          type: string
        function_name:
          description: The function name of the ML model. For local models, valid values are `sparse_encoding`, `sparse_tokenize`, `text_embedding`, and `text_similarity`. For externally hosted models, the valid value is `remote`. Default is `remote`.
          type: string
        model_config:
          description: Custom configuration options for the ML model.
          type: object
          additionalProperties: true
        model_input:
          description: A template that defines the input field format expected by the model. Required for local models.
          type: string
        input_map:
          description: Maps query or document fields to model input fields. Each element is one model invocation.
          type: array
          items:
            $ref: '#/components/schemas/MLInferenceFieldMap'
        output_map:
          description: Maps model output fields to query or document fields.
          type: array
          items:
            $ref: '#/components/schemas/MLInferenceFieldMap'
        optional_input_map:
          x-version-added: '2.19'
          description: Optional mappings from query or document fields to model input fields. Missing fields do not fail the processor.
          type: array
          items:
            $ref: '#/components/schemas/MLInferenceFieldMap'
        optional_output_map:
          x-version-added: '2.19'
          description: Optional mappings from model output fields to query or document fields.
          type: array
          items:
            $ref: '#/components/schemas/MLInferenceFieldMap'
        full_response_path:
          description: If `true`, `model_output_field` is treated as a JSON path and the full model output is parsed. Default is `true` for local models and `false` for remotely hosted models.
          type: boolean
        ignore_missing:
          description: If `true`, skip this processor when mapped input or output fields are missing. Default is `false`.
          type: boolean
        max_prediction_tasks:
          description: The maximum number of concurrent model invocations during search. Default is `10`.
          type: integer
          format: int32
      required:
        - model_id
    MLInferenceSearchRequestProcessor:
      x-version-added: '2.16'
      allOf:
        - $ref: '#/components/schemas/MLInferenceProcessorBase'
        - type: object
          properties:
            query_template:
              description: A query string template used to construct a rewritten query from model output.
              type: string
    MLInferenceSearchResponseProcessor:
      x-version-added: '2.16'
      allOf:
        - $ref: '#/components/schemas/MLInferenceProcessorBase'
        - type: object
          properties:
            override:
              description: If `true`, overwrite an existing document field when the output mapping targets that field. Default is `false`.
              type: boolean
            one_to_one:
              description: If `true`, invoke the model once per document. Default is `false`, which invokes the model once for the full search response.
              type: boolean
    NeuralSparseTwoPhaseRequestProcessor:
      x-version-added: '2.15'
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
        enabled:
          description: Controls whether two-phase processing is enabled. Default is `true`.
          type: boolean
          default: true
        two_phase_parameter:
          $ref: '#/components/schemas/NeuralSparseTwoPhaseParameter'
    NeuralSparseTwoPhaseParameter:
      type: object
      properties:
        prune_type:
          $ref: '#/components/schemas/SparseVectorPruneType'
        prune_ratio:
          description: Threshold used with `prune_type` to split high-weight and low-weight tokens. Default is `0.4`.
          type: number
          format: float
          default: 0.4
        expansion_rate:
          description: Multiplier applied to the query size to determine how many documents are rescored in the second phase. Must be greater than or equal to `1.0`. Default is `5.0`.
          type: number
          format: float
          minimum: 1
          default: 5
        max_window_size:
          description: Maximum number of documents processed by the two-phase processor. Must be greater than or equal to `50`. Default is `10000`.
          type: integer
          format: int32
          minimum: 50
          default: 10000
    SparseVectorPruneType:
      description: The pruning strategy for separating high-weight and low-weight tokens. Default is `max_ratio`.
      type: string
      enum:
        - abs_value
        - alpha_mass
        - max_ratio
        - none
        - top_k
    HybridScoreExplanationResponseProcessor:
      x-version-added: '2.19'
      type: object
      properties:
        tag:
          type: string
        description:
          type: string
        ignore_failure:
          type: boolean
