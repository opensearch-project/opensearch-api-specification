$schema: ../json_schemas/_tags.schema.yaml

tags:
  - name: Document
    description: Index, retrieve, update, and delete individual documents, and run bulk and multi-get operations.
  - name: Search
    description: Run queries against indexes, including multi-search, scroll, point-in-time, terms enum, and query validation.
  - name: Index
    description: Create, open, close, clone, shrink, split, and roll over indexes, and run maintenance such as flush, refresh, force merge, and clear cache.
  - name: Index Settings
    description: Read and update index-level settings.
  - name: Mappings
    description: Define and inspect the field mappings of an index.
  - name: Aliases
    description: Create and manage index aliases.
  - name: Index Templates
    description: Manage index templates and composable component templates.
  - name: Data Streams
    description: Create and manage data streams for append-only time-series data.
  - name: Reindex
    description: Copy documents between indexes and run update-by-query and delete-by-query operations.
  - name: Analyze
    description: Test how text is tokenized and analyzed.
  - name: Script
    description: Manage stored scripts and script contexts.
  - name: Info
    description: Retrieve basic cluster information and check whether the cluster is running.
  - name: Cluster
    description: Inspect and manage cluster-level state, health, settings, and rerouting.
  - name: Nodes
    description: Retrieve node-level statistics, information, and hot threads.
  - name: Tasks
    description: List, inspect, and cancel running tasks.
  - name: List
    description: Retrieve tabular listings of indexes and shards.
  - name: CAT
    description: Compact, human-readable tabular views of cluster, index, and node state.
  - name: Snapshot
    description: Create, restore, and manage snapshots and snapshot repositories.
  - name: Snapshot Policies
    description: Manage snapshot management (SM) policies for automated, scheduled snapshots.
  - name: Remote Store
    description: Manage remote-backed storage operations.
  - name: Dangling Indices
    description: List, import, and delete dangling indexes.
  - name: Ingest Pipelines
    description: Create and manage ingest pipelines and their processors.
  - name: Pull-Based Ingestion
    description: Manage pull-based ingestion from external streaming sources.
  - name: Cross-Cluster Replication
    description: Replicate indexes between clusters and manage replication rules and auto-follow patterns.
  - name: Index State Management
    description: Manage ISM policies, rollups, and transform jobs for index lifecycle automation.
  - name: Workload Management
    description: Manage workload groups and query resource limits.
  - name: Query Insights
    description: Retrieve information about top and recent queries by resource consumption.
  - name: Query Data Sources
    description: Register and manage external query data sources.
  - name: Security
    description: Manage authentication, authorization, roles, role mappings, users, tenants, and audit configuration.
  - name: Security Analytics
    description: Manage detectors, rules, and findings for security analytics.
  - name: ML Commons
    description: Manage machine learning models, model groups, connectors, agents, tasks, and predictions.
  - name: Neural Search
    description: Configure neural search and semantic field processing.
  - name: k-NN
    description: Manage k-nearest-neighbor vector search models, training, and statistics.
  - name: Search Relevance
    description: Run and manage search relevance experiments and judgments.
  - name: Search Pipeline
    description: Create and manage search request and response processing pipelines.
  - name: Learning to Rank
    description: Manage learning-to-rank feature sets, feature stores, and models.
  - name: SQL
    description: Run SQL queries against OpenSearch indexes.
  - name: PPL
    description: Run Piped Processing Language (PPL) queries.
  - name: Asynchronous Search
    description: Submit, retrieve, and manage long-running asynchronous searches.
  - name: Flow Framework
    description: Create and manage automated provisioning workflows and templates.
  - name: Geospatial
    description: Manage geospatial IP2Geo data sources and index geographic data.
  - name: Notifications
    description: Configure notification channels and delivery configurations.
  - name: Observability
    description: Create and manage observability objects such as saved queries and visualizations.
  - name: User Behavior Insights
    description: Capture and manage User Behavior Insights (UBI) events and stores.
